<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* Layout: eine ruhige, einspaltige Handy-App, max. 520px breit, große Tippflächen */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --ink:#1C2A2C; --muted:#56676A; --line:#D3DCDA;
  --accent:#2D6A6E; --accent-ink:#FFFFFF; --accent-soft:#D9E8E5;
  --sand:#EFE3CA; --sand-ink:#5A4A2A;
  --alarm:#B23E2E; --alarm-soft:#F6DCD6; --ok:#3B7A4B;
  --f-display:"Lexend", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111A1B; --surface:#1A2627; --ink:#E5EEEC; --muted:#9DB0AE; --line:#2C3C3D;
  --accent:#6DB3B3; --accent-ink:#0E1A1B; --accent-soft:#213839;
  --sand:#3A3324; --sand-ink:#EBDDBE;
  --alarm:#E5705C; --alarm-soft:#3D2420; --ok:#7CC08C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111A1B; --surface:#1A2627; --ink:#E5EEEC; --muted:#9DB0AE; --line:#2C3C3D;
  --accent:#6DB3B3; --accent-ink:#0E1A1B; --accent-soft:#213839;
  --sand:#3A3324; --sand-ink:#EBDDBE;
  --alarm:#E5705C; --alarm-soft:#3D2420; --ok:#7CC08C; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
[dir="rtl"] body{font-family:"Segoe UI",Tahoma,system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0} .muted{color:var(--muted)} .small{font-size:.9rem}
ul,ol{margin:0;padding-inline-start:1.3em;display:flex;flex-direction:column;gap:6px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.brand{font-family:var(--f-display);font-weight:600;font-size:1.15rem;display:flex;align-items:center;gap:8px;color:var(--accent)}
.brand svg{width:26px;height:26px}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 18px;min-height:52px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:500;font-size:1rem;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ghost{background:transparent;color:var(--accent);border:2px solid var(--line)}
.soft{background:var(--accent-soft);color:var(--ink)}
.danger{background:var(--alarm);color:#fff}
.wide{width:100%}
.iconbtn{min-height:44px;min-width:44px;padding:8px 12px;background:transparent;color:var(--muted);border:2px solid var(--line)}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.sos{background:var(--alarm);color:#fff;border-radius:24px;padding:26px 20px;min-height:120px;font-size:1.35rem;flex-direction:column;gap:4px;box-shadow:0 6px 0 color-mix(in srgb,var(--alarm) 60%,#000 40%)}
.sos small{font-family:var(--f-body);font-weight:400;font-size:.95rem;opacity:.92}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);color:var(--ink);border-radius:var(--r);padding:16px;min-height:96px;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:start;font-weight:500}
.tile svg{width:28px;height:28px;color:var(--accent)}
.tile span.sub{font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--muted)}
label{font-weight:700;font-size:.95rem}
input,textarea,select{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);box-sizing:border-box}
input[type=range]{padding:0;border:0;accent-color:var(--accent)}
textarea{min-height:84px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.choicecard{background:var(--surface);color:var(--ink);border:3px solid var(--line);border-radius:var(--r);padding:16px;text-align:start;flex-direction:column;align-items:stretch;gap:8px;font-weight:400}
.choicecard.on{border-color:var(--accent);background:var(--accent-soft)}
.choicecard b{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.quote{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:.95rem;font-style:italic}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--sand);color:var(--sand-ink);font-size:.8rem;font-weight:700;letter-spacing:.02em}
.progress{display:flex;gap:6px}.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}.progress i.on{background:var(--accent)}
.contact{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.contact:first-child{border-top:0}
.contact div{min-width:0}
.hot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.hot:first-of-type{border-top:0}
.hot>div{min-width:0}
.hot .num{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:1.05rem;user-select:all;direction:ltr;unicode-bidi:embed}
.hot .btn{min-height:44px;padding:8px 14px;flex:none}
#chat{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:88%;padding:12px 16px;border-radius:20px;animation:pop .25s ease-out}
.bubble.bot{background:var(--surface);border-end-start-radius:6px;align-self:flex-start}
.bubble.me{background:var(--accent);color:var(--accent-ink);border-end-end-radius:6px;align-self:flex-end}
@keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
#acts{display:flex;flex-direction:column;gap:10px}
.choice{background:var(--surface);color:var(--ink);border:2px solid var(--line);justify-content:flex-start;text-align:start}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;direction:ltr}
.scale button{min-height:52px;padding:0;color:#fff;font-size:1.15rem}
.scalelab{direction:ltr;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.exbox{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.breath{display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{position:relative;width:220px;height:220px;max-width:100%;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
.orb{position:absolute;inset:0;border-radius:50%;background:var(--accent);opacity:.85;transform:scale(.45);transition:transform 4s ease-in-out}
.blabel{position:relative;font-family:var(--f-display);font-size:1.3rem;font-weight:600;color:var(--accent-ink);text-align:center}
.blabel span{display:block;font-size:2rem;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:var(--accent-soft);padding:4px 10px;border-radius:99px;font-size:.9rem}
.dots{display:flex;gap:8px}.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
.big{font-family:var(--f-display);font-size:3rem;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;direction:ltr}
.alarmring{width:200px;height:200px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:conic-gradient(var(--alarm) var(--p,100%),var(--alarm-soft) 0)}
.alarmring div{width:160px;height:160px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-size:3.4rem;font-weight:600;color:var(--alarm)}
.cancel{min-height:84px;font-size:1.3rem;background:var(--ink);color:var(--bg)}
.status{padding:10px 12px;border-radius:12px;background:var(--bg);font-size:.95rem}
.status.ok{border-inline-start:4px solid var(--ok)} .status.wait{border-inline-start:4px solid var(--sand-ink)}
.chart{overflow-x:auto}
.entry{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.entry:first-child{border-top:0}
.skill{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.skill:first-child{border-top:0}
.skill span{flex:1;min-width:0}
.star{min-height:44px;min-width:44px;padding:0;background:transparent;color:var(--muted);font-size:1.4rem}
.star.on{color:#D99A1E}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:26px;height:26px;flex:none;accent-color:var(--accent)}
.note{background:var(--sand);color:var(--sand-ink);border-radius:14px;padding:12px 14px;font-size:.92rem}
.toggle{display:flex;align-items:center;gap:12px}.toggle input{width:26px;height:26px;flex:none;accent-color:var(--accent)}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;direction:ltr}
.faces button{min-height:60px;padding:0;font-size:1.8rem;background:var(--bg);border:2px solid var(--line)}
.faces button.on{border-color:var(--accent);background:var(--accent-soft)}
.facelab{direction:ltr;display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.showcard{position:fixed;inset:0;z-index:20;background:#123C3F;color:#fff;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.showcard h1{font-size:2.1rem;line-height:1.15}
.showcard p{font-size:1.35rem;line-height:1.4}
.showcard .en{font-size:1.05rem;opacity:.85;border-top:1px solid rgba(255,255,255,.3);padding-top:14px}
.showcard .callnum{font-family:var(--f-display);font-size:1.7rem;font-weight:600;direction:ltr;unicode-bidi:embed}
.showcard button{background:#fff;color:#123C3F}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr;max-width:300px;margin:0 auto;width:100%}
.pin button{min-height:64px;font-size:1.4rem;background:var(--surface);color:var(--ink)}
.pindots{display:flex;justify-content:center;gap:14px;direction:ltr}.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}.pindots i.on{background:var(--accent)}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat div{background:var(--bg);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.say{background:var(--bg);border-radius:14px;padding:12px 14px}
@media print{body{background:#fff;color:#000;padding:0}.noprint{display:none!important}.card{padding:8px 0}}
@media (prefers-reduced-motion: reduce){.bubble{animation:none}.orb{transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>

<script>
/* ============ Speicher ============ */
const KEY='anker_v1';
const DEF={setup:false,lang:'de',name:'',age:'erw',tone:'kumpel',contacts:[],loc:true,
  plan:{signs:'',helps:'',safe:'',reasons:''},
  skillFav:[],skillOwn:[],stepsOwn:[],stepsDone:{},diary:[],
  voice:false,vib:true,checks:[],timer:null,pin:'',discreet:false,remind:false,remindHour:20,cardText:''};
function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(clone(DEF),JSON.parse(r))}catch(e){}return clone(DEF)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
let UNLOCKED=false;

/* ============ Native Brücke (Android-App) ============ */
const NATIVE=(()=>{try{return !!(window.AnkerNative&&AnkerNative.isAvailable())}catch(e){return false}})();
function nat(fn,...a){try{if(NATIVE&&typeof AnkerNative[fn]==='function')return AnkerNative[fn](...a)}catch(e){}return undefined}
const HELPER_URL='https://anker-hilfe.github.io/anker-app/#helfer';

/* ============ Hilfen ============ */
const $=s=>document.querySelector(s);
const app=$('#app');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mode(){return S.tone==='kumpel'?'k':(S.age==='erw'?'s':'d')}
function v(k,d,s){const m=mode();return m==='k'?k:m==='d'?d:(s??d)}
function nm(){return S.name?esc(S.name):''}
function minor(){return S.age!=='erw'}
let GEN=0,TIMERS=[];
function later(fn,ms){const g=GEN;const id=setTimeout(()=>{if(g===GEN)fn()},ms);TIMERS.push(id);return id}
function every(fn,ms){const id=setInterval(fn,ms);TIMERS.push(id);return id}
function clearTimers(){TIMERS.forEach(t=>{clearTimeout(t);clearInterval(t)});TIMERS=[]}
const sleep=ms=>new Promise(r=>later(r,ms));
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function intl(n){let x=String(n).replace(/[^\d+]/g,'');if(x.startsWith('+'))return x.slice(1);if(x.startsWith('00'))return x.slice(2);if(x.startsWith('0'))return '49'+x.slice(1);return x}
function digits(n){return String(n).replace(/[^\d+]/g,'')}
function fmtDate(t){const d=new Date(t);return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})+', '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
function fmtTime(t){return new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
function dayKey(t=Date.now()){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function lvlColor(n){return `hsl(${150-n*14} 48% 38%)`}

/* ============ Sprachen ============ */
const LANGS={de:'Deutsch',en:'English',tr:'Türkçe',ar:'العربية',uk:'Українська'};
const VOICE={de:'de-DE',en:'en-GB',tr:'tr-TR',ar:'ar-SA',uk:'uk-UA'};
const T={
 sosTitle:{de:()=>v("Mir geht's gerade schlecht",'Ich brauche jetzt Hilfe','Ich brauche jetzt Hilfe'),en:'I need help now',tr:'Şu an yardıma ihtiyacım var',ar:'أحتاج إلى مساعدة الآن',uk:'Мені потрібна допомога зараз'},
 sosSub:{de:()=>v('Tippen, ich bin sofort da','Tippen, um zu starten','Tippen, um zu starten'),en:"Tap, I'm here right away",tr:'Dokun, hemen buradayım',ar:'اضغط، أنا هنا فورًا',uk:'Натисни, я одразу поруч'},
 hello:{de:n=>v(`Hey${n?' '+n:''}, schön dass du da bist.`,`Hallo${n?' '+n:''}.`,`Guten Tag${n?' '+n:''}.`),en:n=>`Hi${n?' '+n:''}.`,tr:n=>`Merhaba${n?' '+n:''}.`,ar:n=>`مرحبًا${n?' '+n:''}.`,uk:n=>`Привіт${n?', '+n:''}.`},
 helloSub:{de:()=>v('Egal wie es gerade aussieht, du musst da nicht allein durch.','Ich bin da, wenn du Unterstützung brauchst.','Ich bin da, wenn Sie Unterstützung brauchen.'),en:"You don't have to go through this alone.",tr:'Bununla tek başına başa çıkmak zorunda değilsin.',ar:'لست مضطرًا لمواجهة هذا وحدك.',uk:'Тобі не потрібно проходити через це наодинці.'},
 t_atem:{de:'Atmen',en:'Breathe',tr:'Nefes',ar:'تنفّس',uk:'Дихання'},
 t_atemSub:{de:'1 Minute',en:'1 minute',tr:'1 dakika',ar:'دقيقة واحدة',uk:'1 хвилина'},
 t_54321Sub:{de:'Zurück ins Hier',en:'Back to the here and now',tr:'Şimdiye dön',ar:'العودة إلى الحاضر',uk:'Назад у тут і зараз'},
 t_card:{de:'Zeig das jemandem',en:'Show someone',tr:'Birine göster',ar:'أرِه لشخص ما',uk:'Покажи комусь'},
 t_cardSub:{de:'Karte für Fremde',en:'Card for strangers',tr:'Yabancılar için kart',ar:'بطاقة للغرباء',uk:'Картка для незнайомих'},
 t_timer:{de:'Melde-dich-Timer',en:'Check-in timer',tr:'Haber verme sayacı',ar:'مؤقت الاطمئنان',uk:'Таймер зв’язку'},
 t_skills:{de:'Skills-Box',en:'Skills box',tr:'Beceri kutusu',ar:'صندوق المهارات',uk:'Скринька навичок'},
 t_plan:{de:'Notfallplan',en:'Safety plan',tr:'Acil durum planı',ar:'خطة الطوارئ',uk:'План безпеки'},
 t_diary:{de:'Tagebuch',en:'Journal',tr:'Günlük',ar:'اليوميات',uk:'Щоденник'},
 t_steps:{de:'Kleine Schritte',en:'Small steps',tr:'Küçük adımlar',ar:'خطوات صغيرة',uk:'Маленькі кроки'},
 t_train:{de:'Gesprächs-Training',en:'Conversation practice',tr:'Konuşma alıştırması',ar:'تدريب على المحادثة',uk:'Тренування розмов'},
 t_thought:{de:'Gedanken-Check',en:'Thought check',tr:'Düşünce kontrolü',ar:'فحص الأفكار',uk:'Перевірка думок'},
 t_report:{de:'Bericht',en:'Report',tr:'Rapor',ar:'تقرير',uk:'Звіт'},
 deOnly:{de:'',en:'This area is in German for now.',tr:'Bu bölüm şimdilik Almanca.',ar:'هذا القسم باللغة الألمانية حاليًا.',uk:'Цей розділ поки що німецькою.'},
 hotTitle:{de:'Hilfe-Nummern',en:'Help numbers',tr:'Yardım numaraları',ar:'أرقام المساعدة',uk:'Номери допомоги'},
 call:{de:'Anrufen',en:'Call',tr:'Ara',ar:'اتصال',uk:'Подзвонити'},
 hot112:{de:'Notruf (Lebensgefahr)',en:'Emergency (danger to life)',tr:'Acil çağrı (hayati tehlike)',ar:'الطوارئ (خطر على الحياة)',uk:'Екстрений виклик (загроза життю)'},
 hotTS:{de:'TelefonSeelsorge (24 h, kostenlos)',en:'TelefonSeelsorge crisis line (24 h, free, in German)',tr:'TelefonSeelsorge kriz hattı (7/24, ücretsiz, Almanca)',ar:'خط الدعم TelefonSeelsorge (على مدار الساعة، مجاني، بالألمانية)',uk:'TelefonSeelsorge, кризова лінія (цілодобово, безкоштовно, німецькою)'},
 hotTS2:{de:'TelefonSeelsorge (2. Nummer)',en:'TelefonSeelsorge (2nd number)',tr:'TelefonSeelsorge (2. numara)',ar:'TelefonSeelsorge (الرقم الثاني)',uk:'TelefonSeelsorge (2-й номер)'},
 hotNgK:{de:'Nummer gegen Kummer, Kinder & Jugendliche',en:'Nummer gegen Kummer, children & teens (German)',tr:'Nummer gegen Kummer, çocuklar ve gençler (Almanca)',ar:'Nummer gegen Kummer للأطفال والمراهقين (بالألمانية)',uk:'Nummer gegen Kummer, діти й підлітки (німецькою)'},

 i_atem:{de:()=>v('Okay, wir atmen jetzt zusammen. Folg einfach dem Kreis: Wenn er größer wird, einatmen. Wenn er kleiner wird, langsam ausatmen.','Wir beginnen mit einer Atemübung. Atme ein, während der Kreis wächst, und atme langsam aus, während er kleiner wird.','Wir beginnen mit einer Atemübung. Atmen Sie ein, während der Kreis wächst, und atmen Sie langsam aus, während er kleiner wird.'),en:"Let's breathe together. Breathe in while the circle grows, breathe out slowly while it shrinks.",tr:'Birlikte nefes alalım. Daire büyürken nefes al, küçülürken yavaşça ver.',ar:'لنتنفس معًا. خذ نفسًا عندما تكبر الدائرة، وأخرجه ببطء عندما تصغر.',uk:'Подихаймо разом. Вдихай, коли коло росте, і повільно видихай, коли воно зменшується.'},
 i_vib:{de:'Mit Vibration: Pulsieren = einatmen, Ruhe = ausatmen. Das geht auch mit geschlossenen Augen.',en:'With vibration: pulsing = breathe in, stillness = breathe out. Works with your eyes closed.',tr:'Titreşimle: titreşim = nefes al, sessizlik = nefes ver. Gözlerin kapalıyken de olur.',ar:'مع الاهتزاز: النبض = شهيق، السكون = زفير. يمكنك ذلك وعيناك مغمضتان.',uk:'З вібрацією: пульсує – вдих, тиша – видих. Можна із заплющеними очима.'},
 i_54321:{de:()=>v('Jetzt holen wir dich zurück ins Hier und Jetzt. Schreib mir einfach, was du um dich herum bemerkst. Es gibt kein Falsch.','Die nächste Übung lenkt deine Aufmerksamkeit auf deine Umgebung. Schreibe auf, was du wahrnimmst. Es gibt keine falschen Antworten.','Die nächste Übung lenkt Ihre Aufmerksamkeit auf Ihre Umgebung. Schreiben Sie auf, was Sie wahrnehmen. Es gibt keine falschen Antworten.'),en:"Let's bring you back to the here and now. Type what you notice around you. There are no wrong answers.",tr:'Seni şimdiye geri getirelim. Etrafında fark ettiklerini yaz. Yanlış cevap yok.',ar:'لنُعِدك إلى هنا والآن. اكتب ما تلاحظه حولك. لا توجد إجابات خاطئة.',uk:'Повернімося в тут і зараз. Напиши, що помічаєш навколо. Неправильних відповідей немає.'},
 i_rechnen:{de:()=>v("Dein Kopf braucht was zu tun. Wir rechnen: immer 7 weniger, ab 100. Kein Stress, wenn's mal falsch ist.",'Rechenaufgaben beschäftigen den Kopf und unterbrechen das Gedankenkreisen. Ziehe von 100 immer 7 ab.','Rechenaufgaben beschäftigen den Kopf und unterbrechen das Gedankenkreisen. Ziehen Sie von 100 immer 7 ab.'),en:'Give your mind something to do: start at 100 and keep subtracting 7.',tr:"Zihnine bir iş verelim: 100'den başla ve her seferinde 7 çıkar.",ar:'لنشغل عقلك: ابدأ من 100 واطرح 7 في كل مرة.',uk:'Дай голові заняття: починай зі 100 і щоразу віднімай 7.'},
 i_muskel:{de:()=>v('Die Anspannung muss irgendwo hin. Wir spannen gleich Muskeln fest an und lassen dann los. Fest, aber so, dass es nicht wehtut.','Wir machen eine kurze Muskelentspannung. Spanne die genannte Stelle kräftig an, aber nur so, dass es nicht schmerzt, und lass dann bewusst los.','Wir machen eine kurze Muskelentspannung. Spannen Sie die genannte Stelle kräftig an, aber nur so, dass es nicht schmerzt, und lassen Sie dann bewusst los.'),en:"We'll tense muscles firmly and then let go. Firmly, but never so that it hurts.",tr:'Kasları sıkıca gerip sonra bırakacağız. Sıkıca ama asla acıtmadan.',ar:'سنشدّ العضلات بقوة ثم نُرخيها. بقوة، لكن دون أن تؤلم أبدًا.',uk:'Ми сильно напружимо м’язи, а потім відпустимо. Сильно, але так, щоб не боліло.'},

/* ============ Sprache & Vibration ============ */
function speak(html){if(!S.voice)return;const txt=String(html).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();if(!txt)return;
  if(NATIVE&&nat('speak',txt,VOICE[S.lang])!==undefined)return;
  try{const u=new SpeechSynthesisUtterance(txt);u.lang=VOICE[S.lang];u.rate=.92;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function stopSpeak(){nat('stopSpeak');try{speechSynthesis.cancel()}catch(e){}}
function buzz(pattern){if(!S.vib)return;const p=Array.isArray(pattern)?pattern:[pattern];
  if(NATIVE&&nat('vibratePattern',p.join(','))!==undefined)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
let WAKE=null;
async function keepAwake(on){nat('keepAwake',!!on);try{if(on&&navigator.wakeLock&&!WAKE){WAKE=await navigator.wakeLock.request('screen')}else if(!on&&WAKE){await WAKE.release();WAKE=null}}catch(e){WAKE=null}}

const OPEN_WHEN_LOCKED=['help','krise','alarm','ex','card','helfer','lock','setup'];
let V={name:'home'};
function go(name,params={}){
  if(name==='home'&&!S.setup)name='setup';
  if(S.pin&&!UNLOCKED&&!OPEN_WHEN_LOCKED.includes(name)){params={next:name};name='lock'}
  GEN++;clearTimers();stopSpeak();keepAwake(false);V=Object.assign({name},params);render();window.scrollTo(0,0)}
window.ankerBack=function(){if(V.name==='home'||V.name==='setup'||V.name==='lock')return 'false';if(V.name==='alarm'&&V.phase==='count'){cancelAlarm();return 'true'}go('home');return 'true'};
window.ankerLaunch=function(w){if(w==='hilfe')go(S.setup?'help':'setup');else if(w==='check'||w==='')go('home');else if(w==='zeigen')go('card');else if(w==='helfer')go('helfer')};

function topbar(title,back=true){
  return `<div class="top noprint">${back?`<button class="iconbtn" data-a="home" aria-label="Zurück zum Start">${t('back')}</button>`:`<div class="brand">${ICON.anchor}Anker</div>`}
  ${title?`<h2 style="flex:1;text-align:end">${title}</h2>`:''}</div>`;
}

/* ---- Einrichtung ---- */
VIEWS.setup=()=>{
  const st=V.step||0, total=7;
  const prog=`<div class="progress" aria-label="Schritt ${st+1} von ${total+1}">${Array.from({length:total+1},(_,i)=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>`;
  const nav=(next='Weiter',skip=false)=>`<div class="row">${st>0?`<button class="ghost" data-a="setup-back">Zurück</button>`:''}<button style="flex:1" data-a="setup-next">${next}</button></div>${skip?`<button class="ghost wide" data-a="setup-skip">Erst mal überspringen</button>`:''}`;

  if(st===4) body=`${prog}<h1>Wie soll Anker mit dir sprechen?</h1><p class="muted">Du kannst das später jederzeit in den Einstellungen ändern.</p>
    <button class="choicecard ${S.tone==='kumpel'?'on':''}" data-a="set-tone" data-v="kumpel"><b>Wie ein Kumpel</b><span>Locker, persönlich, auf Augenhöhe.${S.age==='kind'?' <span class="pill">Empfohlen</span>':''}</span>

  if(st===5) body=`${prog}<h1>Deine Vertrauenspersonen</h1>

function lowTrend(){
  const map={};S.checks.forEach(c=>map[c.d]=c.n);
  const day=864e5;let start=map[dayKey()]!=null?0:1;let n=0;
  for(let i=start;i<start+3;i++){const k=dayKey(Date.now()-i*day);if(map[k]!=null&&map[k]<=2)n++;else break}
  return n>=3;
}

VIEWS.help=()=>`<div class="top"><button class="iconbtn" data-a="home">${t('end')}</button><div class="row"><button class="iconbtn" data-a="voice" aria-pressed="${S.voice}">🔊 ${t('voice')}</button><button class="iconbtn" data-a="go" data-v="card" aria-label="${t('t_card')}">${ICON.card.replace('<svg','<svg width="20" height="20"')}</button></div></div><div id="chat"></div><div id="acts"></div>`;
let H={};
function chatEl(){return $('#chat')}
function scrollEnd(){later(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),30)}
async function bot(html,wait=650){await sleep(wait);const c=chatEl();if(!c)return;c.appendChild(el('div','bubble bot',html));speak(html);scrollEnd()}
function me(text){const c=chatEl();if(c){c.appendChild(el('div','bubble me',esc(text)));scrollEnd()}}
function ask(opts){return new Promise(res=>{const a=$('#acts');if(!a)return;a.innerHTML='';opts.forEach(o=>{const b=el('button','choice '+(o.cls||''),o.label);b.onclick=()=>{a.innerHTML='';me(o.say||o.label.replace(/<[^>]+>/g,''));res(o.v)};a.appendChild(b)});scrollEnd()})}
function askLevel(){return new Promise(res=>{const a=$('#acts');if(!a)return;a.innerHTML=`<div class="scale">${Array.from({length:11},(_,n)=>`<button style="background:${lvlColor(n)}" data-n="${n}" aria-label="${t('ofTen',n)}">${n}</button>`).join('')}</div><div class="scalelab"><span>${t('s0')}</span><span>${t('s10')}</span></div>`;
  a.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;a.innerHTML='';me(t('ofTen',n));res(n)});scrollEnd()})}
function exBox(){const c=chatEl();const b=el('div','exbox');c.appendChild(b);scrollEnd();return b}

const EXINFO={
 atem:{name:()=>t('e_atem'),intro:()=>t('i_atem')},
 g54321:{name:()=>'5-4-3-2-1',intro:()=>t('i_54321')},
 rechnen:{name:()=>t('e_rechnen'),intro:()=>t('i_rechnen')},
 muskel:{name:()=>t('e_muskel'),intro:()=>t('i_muskel')},
 skill:{name:()=>t('e_skill'),intro:()=>t('i_skill')}
};
const PLANS={panik:['atem','g54321','muskel'],gedanken:['g54321','rechnen','atem'],wut:['muskel','atem','skill'],leere:['g54321','skill','atem'],anders:['atem','g54321','skill']};

async function helpFlow(){
  H={before:null,after:null,what:null,ex:[],start:Date.now()};
  await bot(t('greet'),300);
  await bot(t('askLevel'));
  const lvl=await askLevel(); H.before=lvl;
  if(lvl>=10){await bot(t('alarmNow'));await sleep(700);logDiary(true);return go('alarm',{from:'help'})}
  await bot(t('askWhat'));
  const w=await ask(['panik','gedanken','wut','leere','krise','anders'].map(k=>({label:t('w_'+k),v:k})));
  H.what=w;
  if(w==='krise'){logDiary(false);return go('krise')}
  if(lvl<=3) await bot(t('early'));
  const plan=PLANS[w];
  for(let i=0;i<plan.length;i++){
    const ex=plan[i];H.ex.push(ex);
    await bot(EXINFO[ex].intro());
    await RUN[ex](exBox());
    await bot(t('askNow'));
    const now=await askLevel(); H.after=now;
    if(now>=10){await bot(t('alarmNow'));await sleep(700);logDiary(true);return go('alarm',{from:'help'})}
    if(now<=3)break;
    if(i<plan.length-1){
      await bot(now<H.before?t('progress',H.before,now):t('notYet'));
      const go2=await ask([{label:t('yes'),v:true},{label:t('no'),v:false}]);
      if(!go2)break;
    }
  }
  logDiary(false);
  const b=H.before,a=H.after;
  await bot(a<b?t('better',b,a):t('worse'));
  if(a>=6) await bot(`<b>${t('callNowT')}</b>${contactCallList()}<div style="margin-top:8px">${hotlinesHTML()}</div>`);
  const next=await ask([{label:t('toHome'),v:'home'},{label:t('more'),v:'more'},...(a>=6?[{label:t('t_card'),v:'card'},{label:t('alarmBtn'),v:'alarm',cls:'danger'}]:[])]);
  if(next==='home')go('home');
  else if(next==='alarm')go('alarm',{from:'help'});
  else if(next==='card')go('card');
  else {await bot(t('which'));const e=await ask(Object.keys(EXINFO).map(k=>({label:EXINFO[k].name(),v:k})));await bot(EXINFO[e].intro());await RUN[e](exBox());await bot(t('goodJob'));await ask([{label:t('toHome'),v:1}]);go('home')}
}
function contactCallList(){
  if(!S.contacts.length)return '';
  return '<div class="stack" style="margin-top:8px">'+S.contacts.map(c=>`<div class="hot"><div><div class="small muted">${esc(c.name)}</div><div class="num">${esc(c.num)}</div></div><a class="btn soft" href="tel:${esc(digits(c.num))}">${ICON.phone}${t('call')}</a></div>`).join('')+'</div>';
}
function logDiary(alarm){
  S.diary.unshift({t:H.start||Date.now(),before:H.before,after:H.after,what:H.what,ex:H.ex.slice(),alarm:!!alarm});
  S.diary=S.diary.slice(0,400);save();
}

/* ---- Übungen ---- */
const RUN={};
RUN.atem=(box,rounds=6)=>new Promise(res=>{
  box.innerHTML=`<div class="breath"><div class="ring"><div class="orb"></div><div class="blabel">${t('ready')}<span></span></div></div><div class="muted small" data-c></div>
   <div class="row" style="justify-content:center"><button class="iconbtn" data-vib aria-pressed="${S.vib}">📳 ${t('vib')}</button><button class="iconbtn" data-voice aria-pressed="${S.voice}">🔊 ${t('voice')}</button></div>
   <p class="small muted" style="text-align:center">${t('i_vib')}</p>
   <button class="ghost" data-done>${t('done')}</button></div>`;
  const orb=box.querySelector('.orb'),lab=box.querySelector('.blabel'),cnt=box.querySelector('[data-c]');
  box.querySelector('[data-vib]').onclick=e=>{S.vib=!S.vib;save();e.currentTarget.setAttribute('aria-pressed',S.vib)};
  box.querySelector('[data-voice]').onclick=e=>{S.voice=!S.voice;save();e.currentTarget.setAttribute('aria-pressed',S.voice);if(!S.voice)stopSpeak()};
  keepAwake(true);
  let r=0,phase=-1,left=0,ended=false,id;
  const PH=[{k:'inhale',d:4,s:1},{k:'exhale',d:6,s:.45}];
  function setPhase(p){phase=p;left=PH[p].d;orb.style.transition=`transform ${PH[p].d}s ease-in-out`;orb.style.transform=`scale(${PH[p].s})`;lab.innerHTML=`${t(PH[p].k)}<span>${left}</span>`;
    if(p===0)buzz([250,750,250,750,250,750,250]);speak(t(PH[p].k))}
  function end(){if(ended)return;ended=true;clearInterval(id);keepAwake(false);orb.style.transform='scale(.45)';lab.innerHTML=t('wellDone')+'<span></span>';const d=box.querySelector('[data-done]');if(d)d.remove();res()}
  box.querySelector('[data-done]').onclick=end;
  later(()=>{r=1;cnt.textContent=t('round',1,rounds);setPhase(0);id=every(()=>{if(ended)return;left--;if(left>0){lab.querySelector('span').textContent=left;return}
    if(phase===0)setPhase(1);else{if(r>=rounds)return end();r++;cnt.textContent=t('round',r,rounds);setPhase(0)}},1000)},900);
});
RUN.g54321=(box)=>new Promise(res=>{
  const steps=[5,4,3,2,1].map(n=>({n,q:t('g'+n),p:t('p'+n)}));
  const praise=t('praise');
  let si=0,items=[];
  function draw(fb=''){const s=steps[si];
    box.innerHTML=`<div class="dots">${Array.from({length:s.n},(_,i)=>`<i class="${i<items.length?'on':''}"></i>`).join('')}</div>
    <p>${s.q}</p>${fb?`<p class="muted small">${fb}</p>`:''}
    <div class="chips">${items.map(x=>`<span>${esc(x)}</span>`).join('')}</div>
    <form class="row" data-f><input id="g-in" placeholder="${esc(s.p)}" autocomplete="off" style="flex:1;min-width:0"><button type="submit">OK</button></form>
    <button class="ghost" data-skip>${t('skip')}</button>`;
    if(!fb)speak(s.q);
    const inp=box.querySelector('#g-in');try{inp.focus({preventScroll:true})}catch(e){}
    box.querySelector('[data-f]').onsubmit=e=>{e.preventDefault();const tx=inp.value.trim();if(!tx){inp.focus();return}items.push(tx);if(items.length>=s.n)next();else draw(praise[items.length%praise.length])};
    box.querySelector('[data-skip]').onclick=next;}
  function next(){si++;items=[];if(si>=steps.length){box.innerHTML=`<p><b>${t('exDone')}</b></p>`;return res()}draw(t('next'))}
  draw();
});
RUN.rechnen=(box)=>new Promise(res=>{
  let cur=100,ok=0;const need=6;
  function draw(fb=''){box.innerHTML=`<div class="big">${cur} − 7 = ?</div>${fb?`<p class="muted">${fb}</p>`:''}
    <form class="row" data-f><input id="r-in" type="number" inputmode="numeric" style="flex:1;min-width:0" aria-label="Ergebnis"><button type="submit">OK</button></form>
    <p class="small muted">${t('okOf',ok,need)}</p><button class="ghost" data-skip>${t('done')}</button>`;
    const inp=box.querySelector('#r-in');try{inp.focus({preventScroll:true})}catch(e){}
    box.querySelector('[data-f]').onsubmit=e=>{e.preventDefault();const n=parseInt(inp.value,10);if(isNaN(n))return;const right=cur-7;
      if(n===right){ok++;cur=right;if(ok>=need)return done();draw(t('right'))}
      else{cur=right;draw(t('wrong',right))}};
    box.querySelector('[data-skip]').onclick=done;}
  function done(){box.innerHTML=`<p><b>${t('exDone')}</b></p>`;res()}
  draw();
});
RUN.muskel=(box)=>new Promise(res=>{
  const parts=['m_hands','m_shoulders','m_face','m_legs'].map(k=>t(k));
  let pi=0,ph='an',left=5,ended=false,id;
  function draw(){box.innerHTML=`<p class="small muted">${t('part',pi+1,parts.length)}</p><h3>${parts[pi]}</h3>
    <div class="big" style="color:${ph==='an'?'var(--alarm)':'var(--ok)'}">${ph==='an'?t('tense'):t('release')}<br>${left}</div>
    <p class="muted small">${ph==='an'?t('tenseHint'):t('releaseHint')}</p>
    <button class="ghost" data-skip>${t('done')}</button>`;box.querySelector('[data-skip]').onclick=end}

  buzz([400,200,400]);
  ALARM.id=every(()=>{ALARM.left--;const n=$('#anum'),r=$('#aring');if(n)n.textContent=ALARM.left;if(r)r.style.setProperty('--p',(ALARM.left*10)+'%');if(ALARM.left<=3&&ALARM.left>0)buzz(150);if(ALARM.left<=0){clearInterval(ALARM.id);fireAlarm()}},1000);

function cancelAlarm(){clearInterval(ALARM.id);go('home')}
function alarmText(loc){
  return `Hier ist ${S.name||'jemand, der dich als Vertrauensperson eingetragen hat'}. Mir geht es gerade sehr schlecht (10 von 10). Bitte ruf mich sofort an oder komm vorbei.${loc?' Mein Standort: '+loc:''} So hilfst du: ${HELPER_URL} (Automatisch gesendet von meiner App Anker)`;

function timerText(loc,until){
  return `Hier ist ${S.name||'jemand, der dich als Vertrauensperson eingetragen hat'}. Ich wollte mich bis ${fmtTime(until)} Uhr melden und habe es nicht getan. Bitte ruf mich an oder schau nach mir.${loc?' Mein letzter Standort: '+loc:''} (Automatisch gesendet von meiner App Anker)`;
}
function getLoc(){return new Promise(res=>{if(!S.loc)return res('');
  const s=nat('getLocation');if(s!==undefined)return res(s?`https://maps.google.com/?q=${s}`:'');
  if(!navigator.geolocation)return res('');let done=false;const tt=setTimeout(()=>{if(!done){done=true;res('')}},4000);
  try{navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(tt);res(`https://maps.google.com/?q=${p.coords.latitude.toFixed(5)},${p.coords.longitude.toFixed(5)}`)},()=>{if(!done){done=true;clearTimeout(tt);res('')}},{timeout:3500,maximumAge:300000})}catch(e){done=true;clearTimeout(tt);res('')}})}
async function fireAlarm(){
  clearInterval(ALARM.id);V.phase='sent';
  const box=$('#alarmbox');if(!box)return;
  box.innerHTML=`<h1>${t('a_wait')}</h1>`;
  const loc=await getLoc();const msg=V.timerExpired?timerText(loc,V.timerExpired):alarmText(loc);ALARM.msg=msg;
  const res=[];let callTarget=null,waTarget=null;
  const list=V.onlyIds?V.onlyIds.map(i=>S.contacts[i]).filter(Boolean):S.contacts;
  for(const c of list){
    const wantsSms=c.how==='sms'||c.how==='both', wantsCall=c.how==='call'||c.how==='both';
    if(wantsSms){const ok=nat('sendSms',c.num,msg)===true;res.push({c,type:'sms',ok})}
    if(wantsCall&&!callTarget)callTarget=c;
    if(c.how==='wa'){res.push({c,type:'wa',ok:false});if(!waTarget)waTarget=c}
  }
  let callOk=false;
  if(NATIVE){if(callTarget)callOk=nat('call',callTarget.num)===true;else if(waTarget)nat('openUrl',waLink(waTarget))}
  showAlarmResult(res,callTarget,callOk);
}
function waLink(c,msg=ALARM.msg){return `https://wa.me/${intl(c.num)}?text=${encodeURIComponent(msg)}`}
function smsLink(c,msg=ALARM.msg){return `sms:${digits(c.num)}?body=${encodeURIComponent(msg)}`}
function showAlarmResult(res,callTarget,callOk){
  const box=$('#alarmbox');if(!box)return;
  const rows=res.map(r=>{
    if(r.type==='sms')return r.ok?`<div class="status ok">${t('smsSent',esc(r.c.name))}</div>`
      :`<div class="status wait"><div>${t('smsPrep',esc(r.c.name))}</div><a class="btn soft wide" style="margin-top:8px" href="${smsLink(r.c)}">${t('openSms')}</a></div>`;
    return `<div class="status wait"><div>${t('waPrep',esc(r.c.name))}</div><a class="btn soft wide" style="margin-top:8px" href="${waLink(r.c)}" target="_blank" rel="noopener">${t('openWa')}</a></div>`;
  }).join('');
  const call=callTarget?(callOk?`<div class="status ok">${t('calling',esc(callTarget.name))}</div>`
    :`<div class="status wait"><div>${t('callWho',esc(callTarget.name))} <span class="num">${esc(callTarget.num)}</span></div><a class="btn danger wide" style="margin-top:8px" href="tel:${esc(digits(callTarget.num))}">${t('callBtn')}</a></div>`):'';
  box.innerHTML=`<h1>${t('a_sent')}</h1>
    ${rows}${call}
    ${!NATIVE?`<p class="small muted">${t('noNative')}</p>`:''}
    <details class="card"><summary>${t('msgShown')}</summary><p class="small">${esc(ALARM.msg)}</p></details>
    <div class="card"><h3>${t('a_112').replace(/<[^>]+>/g,'')}</h3>${hotlinesHTML()}</div>
    <button class="soft" data-a="ex" data-v="atem">${t('breatheWait')}</button>
    <button class="ghost" data-a="go" data-v="card">${t('t_card')}</button>
    <button class="ghost" data-a="all-clear">${t('clear')}</button>`;
}

function reportData(days=30){
  const from=Date.now()-days*864e5;
  const d=S.diary.filter(e=>e.t>=from);
  const helps=d.filter(e=>e.before!=null&&e.what!=='notiz'&&e.what!=='gedanke');
  const withAfter=helps.filter(e=>e.after!=null);
  const avg=a=>a.length?(a.reduce((s,x)=>s+x,0)/a.length):null;
  const whatCount={};helps.forEach(e=>{if(e.what)whatCount[e.what]=(whatCount[e.what]||0)+1});
  const exDrop={};withAfter.forEach(e=>{const ex=(e.ex||[])[0];if(!ex)return;(exDrop[ex]=exDrop[ex]||[]).push(e.before-e.after)});
  const bestEx=Object.entries(exDrop).map(([k,a])=>[k,avg(a)]).sort((a,b)=>b[1]-a[1])[0];
  const checks=S.checks.filter(c=>new Date(c.d).getTime()>=from-864e5);
  const hours={morgens:0,mittags:0,abends:0,nachts:0};helps.forEach(e=>{const h=new Date(e.t).getHours();hours[h<6?'nachts':h<12?'morgens':h<18?'mittags':h<23?'abends':'nachts']++});
  return {days,helps,withAfter,
    avgBefore:avg(helps.map(e=>e.before)),avgAfter:avg(withAfter.map(e=>e.after)),
    improved:withAfter.filter(e=>e.after<e.before).length,alarms:d.filter(e=>e.alarm).length,
    whatCount,bestEx,checks,avgCheck:avg(checks.map(c=>c.n)),hours,
    thoughts:d.filter(e=>e.what==='gedanke'),notes:d.filter(e=>e.note)};
}
function reportText(r){
  const f=x=>x==null?'–':x.toFixed(1).replace('.',',');
  let s=`Anker-Bericht${S.name?' von '+S.name:''}, letzte ${r.days} Tage (Stand ${new Date().toLocaleDateString('de-DE')})\n\n`;
  s+=`Akute Momente: ${r.helps.length}\nØ Belastung vorher: ${f(r.avgBefore)} von 10, nachher: ${f(r.avgAfter)} von 10\nBesser geworden: ${r.improved} von ${r.withAfter.length}\nAlarme an Vertrauenspersonen: ${r.alarms}\n`;
  const w=Object.entries(r.whatCount).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`${WHAT[k]} (${n}×)`).join(', ');if(w)s+=`Häufigste Belastung: ${w}\n`;
  if(r.bestEx)s+=`Hilft am meisten: ${EXNAME[r.bestEx[0]]} (Ø ${f(r.bestEx[1])} Punkte weniger)\n`;
  s+=`Tageszeit: morgens ${r.hours.morgens}, mittags ${r.hours.mittags}, abends ${r.hours.abends}, nachts ${r.hours.nachts}\n`;
  if(r.checks.length)s+=`Tägliche Stimmung (1–5): Ø ${f(r.avgCheck)} an ${r.checks.length} Tagen\n`;
  if(r.thoughts.length)s+=`Gedanken-Checks: ${r.thoughts.length}\n`;
  if(r.notes.length){s+=`\nNotizen:\n`;r.notes.slice(0,15).forEach(e=>s+=`- ${new Date(e.t).toLocaleDateString('de-DE')}: ${e.note.replace(/\n/g,' ')}\n`)}
  return s;
}

async function runScene(){
  const sc=SCENES.find(s=>s.id===V.scene);if(!sc)return;
  await bot(`<i>${sc.intro}</i>`,200);
  for(const st of sc.steps){
    await bot(`<b>${esc(st.o)}</b>`);
    const own='__own';
    const pick=await new Promise(res=>{const a=$('#acts');a.innerHTML='';
      st.a.forEach(x=>{const b=el('button','choice',esc(x));b.onclick=()=>{a.innerHTML='';me(x);res(x)};a.appendChild(b)});
      const f=el('form','row');f.innerHTML='<input id="own-in" placeholder="Oder eigene Antwort schreiben" style="flex:1;min-width:0"><button type="submit">OK</button>';
      f.onsubmit=e=>{e.preventDefault();const x=$('#own-in').value.trim();if(!x)return;a.innerHTML='';me(x);res(own)};a.appendChild(f);scrollEnd()});
    await bot(`${pick===own?v('Gute eigene Antwort!','Gut formuliert.','Gut formuliert.')+' ':''}💡 ${esc(st.tip)}`);
  }
  await bot(`<b>${esc(sc.end)}</b>`);
  S.diary.unshift({t:Date.now(),before:null,after:null,what:'training',ex:[],note:'Geübt: '+sc.title});save();
  const n=await ask([{label:'Anderes Gespräch üben',v:'list'},{label:t('toHome'),v:'home'}]);
  if(n==='list')go('train');else go('home');
}

   <li><b>Ruhe ausstrahlen.</b> Langsam sprechen, gemeinsam atmen (4 ein, 6 aus). Euer ruhiger Körper hilft mit.</li>
   <li><b>Panik ist nicht gefährlich,</b> auch wenn sie sich so anfühlt. Sie geht vorbei, meist nach wenigen Minuten.</li>
   <li><b>Kleine Schritte loben, Vermeidung nicht verstärken.</b> Statt alles abzunehmen: gemeinsam einen kleinen Schritt planen.</li>
   <li><b>Fragen statt raten:</b> „Was hilft dir gerade? Soll ich bei dir bleiben?“</li></ul></div>
  <div class="card"><h3>Privatsphäre</h3><p>Das Tagebuch in Anker gehört eurem Kind. Mit einer PIN ist es geschützt. Sprecht lieber miteinander, statt heimlich nachzulesen. Vertrauen ist die beste Grundlage dafür, dass euer Kind sich in schweren Momenten meldet.</p></div>
  <div class="card"><h3>Wann sofort Hilfe holen</h3><p>Wenn euer Kind über Tod oder Selbstverletzung spricht, sich stark zurückzieht oder ihr euch große Sorgen macht: nicht abwarten. Bei akuter Gefahr <b>112</b>, sonst Kinderarzt, Kinder- und Jugendpsychiatrie oder die Nummern unten.</p></div>
  <div class="card"><h3>Beratung für Eltern</h3>${hotRow('Elterntelefon (Nummer gegen Kummer), kostenlos','0800 111 0 550')}${hotRow('Nummer gegen Kummer für Kinder & Jugendliche','116 111')}${TERMIN_HINT}</div>`;

/* ---- Sperre ---- */
let PINBUF='';
VIEWS.lock=()=>`<div class="stack" style="text-align:center;margin-top:24px"><h1>${t('lockTitle')}</h1><p class="muted">${t('lockPin')}</p>
  <div class="pindots">${[0,1,2,3].map(i=>`<i class="${i<PINBUF.length?'on':''}"></i>`).join('')}</div>
  <p id="pin-err" class="small" style="color:var(--alarm)" ${V.err?'':'hidden'}>${t('lockWrong')}</p>
  <div class="pin">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-a="pin" data-v="${k}">${k}</button>`).join('')}</div>
  <button class="danger" style="margin-top:12px" data-a="help">${t('lockSos')}</button>
  <details class="card" style="text-align:start"><summary>${t('hotTitle')}</summary>${hotlinesHTML()}</details></div>`;

/* ---- Einstellungen ---- */
VIEWS.settings=()=>`${topbar('Einstellungen')}
  <div class="card"><div class="field"><label for="f-name">Name</label><input id="f-name" value="${esc(S.name)}"></div>
  <div class="field"><label for="f-age">Alter</label><select id="f-age">${[['kind','Kind (bis 12)'],['jugend','Jugendlich (13 bis 17)'],['erw','Erwachsen (ab 18)']].map(([k,tt])=>`<option value="${k}" ${S.age===k?'selected':''}>${tt}</option>`).join('')}</select></div>
  <div class="field"><label for="f-lang">Sprache · Language</label><select id="f-lang">${Object.entries(LANGS).map(([k,n])=>`<option value="${k}" ${S.lang===k?'selected':''}>${n}</option>`).join('')}</select></div>
  <button class="soft" data-a="save-basic">Speichern</button></div>
  <h2>Wie spricht Anker mit dir?</h2>
  <button class="choicecard ${S.tone==='kumpel'?'on':''}" data-a="tone2" data-v="kumpel"><b>Wie ein Kumpel</b><span>Locker und persönlich</span></button>
  <button class="choicecard ${S.tone==='profi'?'on':''}" data-a="tone2" data-v="profi"><b>Professionell</b><span>Ruhig und sachlich${S.age==='erw'?', mit „Sie“':''}</span></button>
  <div class="card"><h3>Übungen</h3>
   <label class="toggle"><input type="checkbox" data-a="set-vib" ${S.vib?'checked':''}> Vibration beim Atmen (Pulsieren = einatmen)</label>
   <label class="toggle"><input type="checkbox" data-a="set-voice" ${S.voice?'checked':''}> Anker liest Texte und Übungen vor</label></div>
  <h2>Vertrauenspersonen</h2>${contactsEditor()}
  <div class="card"><h3>Karte „Zeig das jemandem“</h3><p class="small muted">Dieser Text erscheint groß auf der Karte für Fremde. Die erste Vertrauensperson wird mit Nummer angezeigt.</p>
   <textarea id="f-card">${esc(S.cardText||CARD_DE)}</textarea><div class="row"><button class="soft" data-a="save-card" style="flex:1">Speichern</button><button class="ghost" data-a="go" data-v="card" style="flex:1">Ansehen</button></div></div>
  <div class="card"><h3>Täglicher Kurz-Check</h3>
   ${NATIVE?`<label class="toggle"><input type="checkbox" data-a="set-remind" ${S.remind?'checked':''}> Täglich erinnern um</label>
   <select id="f-rh" data-a="set-rh">${Array.from({length:15},(_,i)=>i+8).map(h=>`<option value="${h}" ${S.remindHour===h?'selected':''}>${h}:00 Uhr</option>`).join('')}</select>`
   :'<p class="small muted">Erinnerungen gibt es in der Android-App. Hier im Browser findest du den Check auf der Startseite.</p>'}</div>
  <div class="card"><h3>Privatsphäre</h3>
   <p class="small muted">Mit PIN sind Tagebuch, Bericht, Notfallplan und Einstellungen geschützt. Der Notfall-Knopf, die Übungen und die Hilfe-Nummern bleiben immer ohne PIN erreichbar.</p>
   ${S.pin?`<p><b>PIN ist aktiv.</b></p><button class="ghost" data-a="pin-off">PIN entfernen</button>`
    :`<div class="row"><input id="f-pin" type="password" inputmode="numeric" maxlength="4" placeholder="4 Ziffern" style="flex:1;min-width:0" autocomplete="off"><button class="soft" data-a="pin-on">PIN setzen</button></div><p id="pin-msg" class="small" style="color:var(--alarm)" hidden>Bitte genau 4 Ziffern eingeben.</p>`}
   <label class="toggle"><input type="checkbox" data-a="set-discreet" ${S.discreet?'checked':''}> Diskreter Modus: neutraler Name „Notizen“ ${NATIVE?'und neutrales Symbol auf dem Startbildschirm':'im Browser-Tab'}</label>
   ${S.discreet&&NATIVE?'<p class="small muted">Das Symbol auf dem Startbildschirm ändert sich nach ein paar Sekunden. Eine Verknüpfung oder ein Widget musst du eventuell neu anlegen.</p>':''}</div>
  <div class="card"><h3>Weitere Infos</h3><button class="ghost" data-a="go" data-v="helfer">Seite für Vertrauenspersonen ansehen</button>${minor()?'<button class="ghost" data-a="go" data-v="eltern">Seite für Eltern ansehen</button>':''}</div>
  <div class="card"><h3>Alarm testen</h3><p class="small muted">Zeigt die Nachricht, ohne etwas zu senden.</p><p class="small quote" id="testmsg" hidden></p><button class="ghost" data-a="test-alarm">Nachricht anzeigen</button>
  <p class="small">Automatisches Senden: <b>${NATIVE?'aktiv (Android-App)':'nicht verfügbar (Browser), du tippst noch auf Senden'}</b></p>
  ${NATIVE?`<button class="ghost" data-a="perms">Berechtigungen prüfen</button>`:''}</div>
  <div class="card"><h3>Daten</h3><p class="small muted">Alle Daten liegen nur auf diesem Gerät.</p>
  <div id="wipe"><button class="ghost" data-a="wipe-ask">Alle Daten löschen</button></div></div>`;

/* ============ Rendern & Aktionen ============ */
function render(){
  applyLang();
  app.innerHTML=(VIEWS[V.name]||VIEWS.home)();
  if(V.name==='help')helpFlow();
  if(V.name==='ex')runSingle();
  if(V.name==='alarm')startAlarm();
  if(V.name==='card')keepAwake(true);
  if(V.name==='train'&&V.scene!=null)runScene();
}
function addContact(){
  const n=$('#c-name').value.trim(),num=$('#c-num').value.trim(),how=$('#c-how').value,err=$('#c-err');
  if(!n||digits(num).replace('+','').length<5){err.textContent=!n?'Bitte gib einen Namen ein.':'Bitte gib eine gültige Telefonnummer ein.';err.hidden=false;return}
  S.contacts.push({name:n,num,how});save();render();
}
function act(a,d,e){
  switch(a){
    case 'home':return go('home');
    case 'go':return go(d.v);
    case 'help':return go(S.setup?'help':'setup');
    case 'ex':return go('ex',{ex:d.v});
    case 'set-lang':S.lang=d.v;save();return render();
    case 'setup-next':
      if(V.step===2){S.name=$('#f-name').value.trim()}
      if(V.step===6)readPlan();
      save();V.step=(V.step||0)+1;return render();
    case 'setup-skip':V.step++;return render();
    case 'setup-back':if(V.step===6)readPlan();V.step--;return render();
    case 'setup-done':S.setup=true;save();return go('home');
    case 'set-age':S.age=d.v;if(d.v==='kind')S.tone='kumpel';save();return render();
    case 'set-tone':case 'tone2':S.tone=d.v;save();return render();
    case 'add-contact':return addContact();
    case 'del-contact':S.contacts.splice(+d.i,1);if(S.timer){S.timer=null;scheduleNativeTimer()}save();return render();
    case 'toggle-loc':S.loc=e.checked;save();return;
    case 'voice':S.voice=!S.voice;save();e.setAttribute('aria-pressed',S.voice);if(!S.voice)stopSpeak();return;
    case 'check':{const n=+d.v;S.checks=S.checks.filter(c=>c.d!==dayKey());S.checks.push({d:dayKey(),n});S.checks=S.checks.slice(-400);save();V.justChecked=true;return render()}
    case 'card-close':keepAwake(false);return go('home');
    case 'timer-min':V.min=+d.v;return render();
    case 'timer-start':return startTimer();
    case 'timer-stop':S.timer=null;save();scheduleNativeTimer();return go('home');
    case 'timer-add':if(S.timer){S.timer.until+=15*60000;save();scheduleNativeTimer()}return render();
    case 'plan-edit':V.edit=true;return render();
    case 'plan-save':readPlan();V.edit=false;return render();
    case 'fav':{const i=S.skillFav.indexOf(d.v);if(i>=0)S.skillFav.splice(i,1);else S.skillFav.push(d.v);save();return render()}
    case 'del-skill':S.skillOwn=S.skillOwn.filter(x=>x!==d.v);S.skillFav=S.skillFav.filter(x=>x!==d.v);save();return render();
    case 'step':S.stepsDone[d.v]=e.checked;save();return render();
    case 'del-step':S.stepsOwn=S.stepsOwn.filter(x=>x!==d.v);delete S.stepsDone[d.v];save();return render();
    case 'steps-reset':S.stepsDone={};save();return render();
    case 'diary-add':{const n=+$('#d-lvl').value,tx=$('#d-note').value.trim();S.diary.unshift({t:Date.now(),before:n,after:null,what:'notiz',ex:[],note:tx});save();return render()}
    case 'report-days':V.days=+d.v;return render();
    case 'report-print':{if(nat('printPage')!==undefined)return;try{window.print()}catch(x){}const m=$('#rep-msg');if(m){m.textContent='Falls sich kein Druckfenster öffnet: Öffne Anker im Browser oder in der Android-App und versuche es dort.';m.hidden=false}return}
    case 'report-share':{const tx=reportText(reportData(V.days||30));if(nat('share',tx)!==undefined)return;
      if(navigator.share){navigator.share({title:'Anker-Bericht',text:tx}).catch(()=>{});return}
      const m=$('#rep-msg');(navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).then(()=>{m.textContent='Der Bericht wurde als Text kopiert.';m.hidden=false}).catch(()=>{m.textContent=tx;m.style.whiteSpace='pre-wrap';m.hidden=false});return}
    case 'scene':return go('train',{scene:d.v});
    case 'thought-new':return go('thought');
    case 'thought-back':{saveTQ();V.i--;return render()}
    case 'thought-next':{const q=TQ[V.i||0];const val=$('#tq').value;if(!q.slider&&q.k==='thought'&&!val.trim()){$('#tq-err').hidden=false;return}
      saveTQ();V.i=(V.i||0)+1;if(V.i>=TQ.length){const A=V.ans;S.diary.unshift({t:Date.now(),before:null,after:null,what:'gedanke',ex:[],note:`Gedanke: ${A.thought}\nDafür: ${A.pro||'–'}\nDagegen: ${A.contra||'–'}\nNeuer Gedanke: ${A.new||'–'}\nGlaube: ${A.belief1??0} % → ${A.belief2??0} %`});save()}
      return render()}
    case 'alarm-cancel':return cancelAlarm();
    case 'alarm-now':clearInterval(ALARM.id);return fireAlarm();
    case 'all-clear':return allClear();
    case 'save-basic':{S.name=$('#f-name').value.trim();S.age=$('#f-age').value;S.lang=$('#f-lang').value;save();return render()}
    case 'save-card':S.cardText=$('#f-card').value.trim();if(S.cardText===CARD_DE)S.cardText='';save();return render();
    case 'set-vib':S.vib=e.checked;save();return;
    case 'set-voice':S.voice=e.checked;save();if(S.voice)speak('Vorlesen ist eingeschaltet.');return;
    case 'set-remind':S.remind=e.checked;save();nat('setReminder',S.remind,S.remindHour);return;
    case 'set-rh':S.remindHour=+e.value;save();if(S.remind)nat('setReminder',true,S.remindHour);return;
    case 'set-discreet':S.discreet=e.checked;save();nat('setDiscreet',S.discreet);return render();
    case 'pin-on':{const p=$('#f-pin').value;if(!/^\d{4}$/.test(p)){$('#pin-msg').hidden=false;return}S.pin=p;UNLOCKED=true;save();return render()}
    case 'pin-off':S.pin='';save();return render();
    case 'pin':{if(d.v==='⌫')PINBUF=PINBUF.slice(0,-1);else if(PINBUF.length<4)PINBUF+=d.v;
      if(PINBUF.length===4){if(PINBUF===S.pin){UNLOCKED=true;PINBUF='';return go(V.next||'home')}PINBUF='';V.err=true}else V.err=false;return render()}
    case 'test-alarm':{const m=$('#testmsg');m.textContent=alarmText(S.loc?'(Link zu deinem Standort)':'');m.hidden=false;return}
    case 'perms':nat('requestPermissions');return;
    case 'wipe-ask':$('#wipe').innerHTML=`<p><b>Wirklich alles löschen?</b> Kontakte, Notfallplan und Tagebuch sind dann weg.</p><div class="row"><button class="danger" data-a="wipe">Ja, löschen</button><button class="ghost" data-a="go" data-v="settings">Abbrechen</button></div>`;return;
    case 'wipe':nat('cancelTimer');nat('setReminder',false,20);if(S.discreet)nat('setDiscreet',false);S=clone(DEF);save();UNLOCKED=false;return go('setup',{step:0});
  }
}
function saveTQ(){const q=TQ[V.i||0];const el2=$('#tq');if(!el2)return;V.ans=V.ans||{};V.ans[q.k]=q.slider?+el2.value:el2.value.trim()}
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;act(b.dataset.a,b.dataset,b)});
app.addEventListener('change',e=>{const b=e.target.closest('input[data-a],select[data-a]');if(b)act(b.dataset.a,b.dataset,b)});
app.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f||!['skill','step'].includes(f.dataset.f))return;e.preventDefault();
  if(f.dataset.f==='skill'){const x=$('#s-new').value.trim();if(x&&!S.skillOwn.includes(x)){S.skillOwn.push(x);S.skillFav.push(x);save()}render()}
  if(f.dataset.f==='step'){const x=$('#st-new').value.trim();if(x&&!S.stepsOwn.includes(x)){S.stepsOwn.push(x);save()}render()}});

/* ============ Start ============ */
(function boot(){
  const launch=(location.hash||'').slice(1)||nat('getLaunch')||'';
  if(launch==='helfer'){V={name:'helfer'};render();return}
  if(!S.setup){V={name:'setup',step:0};render();return}
  if(launch==='hilfe'){V={name:'help'};render();return}
  if(launch==='zeigen'){V={name:'card'};render();return}
  if(S.timer&&!NATIVE&&Date.now()>=S.timer.until){checkTimer();return}
  if(S.pin){V={name:'lock',next:'home'};render();return}
  V={name:'home'};render();
})();
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['hilfe','helfer','zeigen'].includes(h))ankerLaunch(h)});
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
