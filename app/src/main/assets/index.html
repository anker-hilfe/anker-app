<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="apple-touch-icon" href="icon-192.png">

<style>
/* Layout: eine ruhige, einspaltige Handy-App, max. 520px breit, große Tippflächen */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --ink:#1C2A2C; --muted:#56676A; --line:#D3DCDA;
  --accent:#2D6A6E; --accent-ink:#FFFFFF; --accent-soft:#D9E8E5;
  --sand:#EFE3CA; --sand-ink:#5A4A2A;
  --alarm:#B23E2E; --alarm-soft:#F6DCD6; --ok:#3B7A4B;
  --f-display:"Lexend", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111A1B; --surface:#1A2627; --ink:#E5EEEC; --muted:#9DB0AE; --line:#2C3C3D;
  --accent:#6DB3B3; --accent-ink:#0E1A1B; --accent-soft:#213839;
  --sand:#3A3324; --sand-ink:#EBDDBE;
  --alarm:#E5705C; --alarm-soft:#3D2420; --ok:#7CC08C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111A1B; --surface:#1A2627; --ink:#E5EEEC; --muted:#9DB0AE; --line:#2C3C3D;
  --accent:#6DB3B3; --accent-ink:#0E1A1B; --accent-soft:#213839;
  --sand:#3A3324; --sand-ink:#EBDDBE;
  --alarm:#E5705C; --alarm-soft:#3D2420; --ok:#7CC08C; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
[dir="rtl"] body{font-family:"Segoe UI",Tahoma,system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0} .muted{color:var(--muted)} .small{font-size:.9rem}
ul,ol{margin:0;padding-inline-start:1.3em;display:flex;flex-direction:column;gap:6px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.brand{font-family:var(--f-display);font-weight:600;font-size:1.15rem;display:flex;align-items:center;gap:8px;color:var(--accent)}
.brand svg{width:26px;height:26px}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 18px;min-height:52px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:500;font-size:1rem;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ghost{background:transparent;color:var(--accent);border:2px solid var(--line)}
.soft{background:var(--accent-soft);color:var(--ink)}
.danger{background:var(--alarm);color:#fff}
.wide{width:100%}
.iconbtn{min-height:44px;min-width:44px;padding:8px 12px;background:transparent;color:var(--muted);border:2px solid var(--line)}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.sos{background:var(--alarm);color:#fff;border-radius:24px;padding:26px 20px;min-height:120px;font-size:1.35rem;flex-direction:column;gap:4px;box-shadow:0 6px 0 color-mix(in srgb,var(--alarm) 60%,#000 40%)}
.sos small{font-family:var(--f-body);font-weight:400;font-size:.95rem;opacity:.92}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);color:var(--ink);border-radius:var(--r);padding:16px;min-height:96px;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:start;font-weight:500}
.tile svg{width:28px;height:28px;color:var(--accent)}
.tile span.sub{font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--muted)}
label{font-weight:700;font-size:.95rem}
input,textarea,select{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);box-sizing:border-box}
input[type=range]{padding:0;border:0;accent-color:var(--accent)}
textarea{min-height:84px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.choicecard{background:var(--surface);color:var(--ink);border:3px solid var(--line);border-radius:var(--r);padding:16px;text-align:start;flex-direction:column;align-items:stretch;gap:8px;font-weight:400}
.choicecard.on{border-color:var(--accent);background:var(--accent-soft)}
.choicecard b{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.quote{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:.95rem;font-style:italic}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--sand);color:var(--sand-ink);font-size:.8rem;font-weight:700;letter-spacing:.02em}
.progress{display:flex;gap:6px}.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}.progress i.on{background:var(--accent)}
.contact{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.contact:first-child{border-top:0}
.contact div{min-width:0}
.hot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.hot:first-of-type{border-top:0}
.hot>div{min-width:0}
.hot .num{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:1.05rem;user-select:all;direction:ltr;unicode-bidi:embed}
.hot .btn{min-height:44px;padding:8px 14px;flex:none}
#chat{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:88%;padding:12px 16px;border-radius:20px;animation:pop .25s ease-out}
.bubble.bot{background:var(--surface);border-end-start-radius:6px;align-self:flex-start}
.bubble.me{background:var(--accent);color:var(--accent-ink);border-end-end-radius:6px;align-self:flex-end}
@keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
#acts{display:flex;flex-direction:column;gap:10px}
.choice{background:var(--surface);color:var(--ink);border:2px solid var(--line);justify-content:flex-start;text-align:start}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;direction:ltr}
.scale button{min-height:52px;padding:0;color:#fff;font-size:1.15rem}
.scalelab{direction:ltr;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.exbox{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.breath{display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{position:relative;width:220px;height:220px;max-width:100%;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
.orb{position:absolute;inset:0;border-radius:50%;background:var(--accent);opacity:.85;transform:scale(.45);transition:transform 4s ease-in-out}
.blabel{position:relative;font-family:var(--f-display);font-size:1.3rem;font-weight:600;color:var(--accent-ink);text-align:center}
.blabel span{display:block;font-size:2rem;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:var(--accent-soft);padding:4px 10px;border-radius:99px;font-size:.9rem}
.dots{display:flex;gap:8px}.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
.big{font-family:var(--f-display);font-size:3rem;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;direction:ltr}
/* Startseite mit Reitern */
.sect{font-size:1.1rem;margin-top:6px}
.list{background:var(--surface);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.lrow{background:transparent;color:var(--ink);border-radius:0;justify-content:flex-start;text-align:start;gap:14px;padding:14px 16px;min-height:64px;font-weight:400;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow>svg{width:26px;height:26px;color:var(--accent);flex:none}
.lrow .lt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.lrow .lt b{font-family:var(--f-display);font-weight:500}
.lrow .sub{font-family:var(--f-body);font-size:.85rem;color:var(--muted)}
.lrow .end{color:var(--muted);font-size:1.3rem;flex:none}
.lrow .unl{color:var(--ok);font-weight:600;font-size:.85rem}
.lrow .meter{margin:0}
.lrow.news{display:flex;align-items:flex-start;cursor:default}.lrow.news>svg{margin-top:2px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;max-width:170px;background:transparent;color:var(--muted);flex-direction:column;gap:2px;padding:6px 4px;min-height:56px;font-size:.8rem;border-radius:12px}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
.tabspace{height:64px}
@media print{.tabbar,.tabspace{display:none}}
/* Version 2.2 */
.recdot{display:flex;align-items:center;gap:10px;justify-content:center;font-family:var(--f-display);font-size:1.4rem}
.recdot i{width:16px;height:16px;border-radius:50%;background:var(--alarm);animation:blink 1s infinite}
.recdot.play i{background:var(--accent)}
@keyframes blink{50%{opacity:.25}}
.sndbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sndbar .iconbtn{min-height:40px;padding:8px 12px}
.sndbig{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.sndbig .tile{align-items:center;text-align:center;min-height:100px}
[data-snd][aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.quiet{filter:saturate(.3)}
.exbox .dark{background:#000;color:#9a9a9a;border-radius:var(--r);min-height:320px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;text-align:center;padding:20px}
.ogtxt{font-size:1.2rem;line-height:1.5}
.tapcount{width:100%;min-height:150px;flex-direction:column;background:var(--accent-soft);color:var(--ink)}
.sw{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:middle;border:1px solid var(--line)}
.feelgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.feel{flex-direction:column;background:var(--surface);color:var(--ink);border:3px solid color-mix(in srgb,var(--fc) 45%,transparent);min-height:104px;gap:4px}
.feel span{font-size:2.2rem;line-height:1}
.big2 .choice{flex:1 1 45%}
.badgegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;opacity:.55;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;box-shadow:inset 0 0 0 2px var(--ok)}
.badge .be{font-size:2.2rem}
.lrow.acc{display:block;cursor:pointer}.lrow.acc summary{padding:2px 0}.lrow.acc p{margin-top:6px}
.lrow .iconbtn{flex:none}
/* Üben zu Hause */
.sechead{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.tile .unl{color:var(--ok);font-weight:600}
.meter{display:flex;gap:4px;margin-top:4px}.meter i{width:18px;height:6px;border-radius:3px;background:var(--line)}.meter i.on{background:var(--ok)}
/* Schublade */
.cabwrap{position:relative;height:236px;width:100%;max-width:280px;margin:0 auto}
.cab{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:210px;height:140px;background:var(--sand);border-radius:14px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.cab .tray{position:absolute;left:16px;right:16px;top:28px;height:44px;border-radius:6px;background:var(--sand-ink);opacity:0;transition:opacity .6s}
.cab .front{position:absolute;left:16px;right:16px;top:28px;height:62px;border-radius:10px;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;transition:transform .9s ease-in-out;z-index:2}
.cab .front .knob{width:44px;height:10px;border-radius:5px;background:var(--line);transition:opacity .4s}
.cab .front .lk{position:absolute;opacity:0;transition:opacity .5s;color:var(--accent)}
.cab .front .lk svg{width:30px;height:30px}
.cabwrap.open .tray{opacity:.25}.cabwrap.open .front{transform:translateY(46px) scale(1.06)}
.cabwrap.locked .knob{opacity:0}.cabwrap.locked .lk{opacity:1}
.cabwrap .paper{position:absolute;left:50%;top:0;width:170px;transform:translateX(-50%) rotate(-3deg);background:#FFFDF6;color:#3A3324;border-radius:6px;padding:10px 12px;font-size:.9rem;line-height:1.3;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:top 1.2s ease-in,transform 1.2s ease-in,opacity .5s ease-in .9s;z-index:1;overflow-wrap:anywhere}
.cabwrap.in .paper{top:122px;transform:translateX(-50%) rotate(0) scale(.4);opacity:0}
.say{min-height:3em;text-align:center}
/* Traumreise */
.dream{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.dream .sun{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--sand) 0%,var(--accent-soft) 55%,transparent 72%);animation:glow 8s ease-in-out infinite}
@keyframes glow{0%,100%{transform:scale(.9);opacity:.8}50%{transform:scale(1.08);opacity:1}}
@media (prefers-reduced-motion:reduce){.dream .sun{animation:none}.cab .front,.cabwrap .paper{transition:none}}
.dream p.txt{font-size:1.15rem;line-height:1.6;min-height:6.5em;transition:opacity .6s}
.bar{width:100%;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width 1s linear}
/* Bilderraten */
.pic{width:180px;height:180px;margin:0 auto;border-radius:var(--r);background:var(--bg);display:grid;place-items:center;overflow:hidden}
.pic span{font-size:110px;line-height:1;transition:filter 1.3s linear;user-select:none}
.guess{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.guess button{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.guess button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--surface))}
.guess button.no{opacity:.45}
.alarmring{width:200px;height:200px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:conic-gradient(var(--alarm) var(--p,100%),var(--alarm-soft) 0)}
.alarmring div{width:160px;height:160px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-size:3.4rem;font-weight:600;color:var(--alarm)}
.cancel{min-height:84px;font-size:1.3rem;background:var(--ink);color:var(--bg)}
.status{padding:10px 12px;border-radius:12px;background:var(--bg);font-size:.95rem}
.status.ok{border-inline-start:4px solid var(--ok)} .status.wait{border-inline-start:4px solid var(--sand-ink)}
.chart{overflow-x:auto}
.entry{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.entry:first-child{border-top:0}
.skill{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.skill:first-child{border-top:0}
.skill span{flex:1;min-width:0}
.star{min-height:44px;min-width:44px;padding:0;background:transparent;color:var(--muted);font-size:1.4rem}
.star.on{color:#D99A1E}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:26px;height:26px;flex:none;accent-color:var(--accent)}
.note{background:var(--sand);color:var(--sand-ink);border-radius:14px;padding:12px 14px;font-size:.92rem}
.toggle{display:flex;align-items:center;gap:12px}.toggle input{width:26px;height:26px;flex:none;accent-color:var(--accent)}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;direction:ltr}
.faces button{min-height:60px;padding:0;font-size:1.8rem;background:var(--bg);border:2px solid var(--line)}
.faces button.on{border-color:var(--accent);background:var(--accent-soft)}
.facelab{direction:ltr;display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.showcard{position:fixed;inset:0;z-index:20;background:#123C3F;color:#fff;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.showcard h1{font-size:2.1rem;line-height:1.15}
.showcard p{font-size:1.35rem;line-height:1.4}
.showcard .en{font-size:1.05rem;opacity:.85;border-top:1px solid rgba(255,255,255,.3);padding-top:14px}
.showcard .callnum{font-family:var(--f-display);font-size:1.7rem;font-weight:600;direction:ltr;unicode-bidi:embed}
.showcard button{background:#fff;color:#123C3F}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr;max-width:300px;margin:0 auto;width:100%}
.pin button{min-height:64px;font-size:1.4rem;background:var(--surface);color:var(--ink)}
.pindots{display:flex;justify-content:center;gap:14px;direction:ltr}.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}.pindots i.on{background:var(--accent)}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat div{background:var(--bg);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.say{background:var(--bg);border-radius:14px;padding:12px 14px}
@media print{body{background:#fff;color:#000;padding:0}.noprint{display:none!important}.card{padding:8px 0}}
@media (prefers-reduced-motion: reduce){.bubble{animation:none}.orb{transition-duration:.01s!important}}
</style>

<body>
<div id="app" aria-live="polite"></div>

<script>
/* ============ Speicher ============ */
const KEY='anker_v1';
const DEF={setup:false,lang:'de',name:'',age:'erw',tone:'kumpel',contacts:[],loc:true,
  plan:{signs:'',helps:'',safe:'',reasons:''},
  skillFav:[],skillOwn:[],stepsOwn:[],stepsDone:{},diary:[],
  voice:false,vib:true,checks:[],timer:null,pin:'',discreet:false,remind:false,remindHour:20,cardText:'',
  practice:{},drawer:[],dreamKind:'',dreamPlace:'',seenVersion:'',
  exDone:{},voiceN:0,badgesSeen:[],theme:'auto',fontSize:1,diaryPin:''};
function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(clone(DEF),JSON.parse(r))}catch(e){}return clone(DEF)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
let UNLOCKED=false,DIARY_OPEN=false;
const DIARY_VIEWS=['diary','report'];

/* ============ Native Brücke (Android-App) ============ */
const NATIVE=(()=>{try{return !!(window.AnkerNative&&AnkerNative.isAvailable())}catch(e){return false}})();
function nat(fn,...a){try{if(NATIVE&&typeof AnkerNative[fn]==='function')return AnkerNative[fn](...a)}catch(e){}return undefined}
const HELPER_URL='https://anker-hilfe.github.io/anker-app/#helfer';

/* ============ Hilfen ============ */
const $=s=>document.querySelector(s);
const app=$('#app');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mode(){return S.tone==='kumpel'?'k':(S.age==='erw'?'s':'d')}
function v(k,d,s){const m=mode();return m==='k'?k:m==='d'?d:(s??d)}
function nm(){return S.name?esc(S.name):''}
function minor(){return S.age!=='erw'}
let GEN=0,TIMERS=[];
function later(fn,ms){const g=GEN;const id=setTimeout(()=>{if(g===GEN)fn()},ms);TIMERS.push(id);return id}
function every(fn,ms){const id=setInterval(fn,ms);TIMERS.push(id);return id}
function clearTimers(){TIMERS.forEach(t=>{clearTimeout(t);clearInterval(t)});TIMERS=[]}
const sleep=ms=>new Promise(r=>later(r,ms));
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function intl(n){let x=String(n).replace(/[^\d+]/g,'');if(x.startsWith('+'))return x.slice(1);if(x.startsWith('00'))return x.slice(2);if(x.startsWith('0'))return '49'+x.slice(1);return x}
function digits(n){return String(n).replace(/[^\d+]/g,'')}
function fmtDate(t){const d=new Date(t);return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})+', '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
function fmtTime(t){return new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
function dayKey(t=Date.now()){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function lvlColor(n){return `hsl(${150-n*14} 48% 38%)`}

function t(key,...a){const e=T[key];if(!e)return key;let val=S.lang==='de'?e.de:(e[S.lang]??e.en??e.de);return typeof val==='function'?val(...a):val}
function applyLang(){const r=document.documentElement;r.lang=S.lang;r.dir=S.lang==='ar'?'rtl':'ltr';document.title=S.discreet?'Notizen':'Anker'}

/* ============ Sprache & Vibration ============ */
function speak(html){if(!S.voice)return;const txt=String(html).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();if(!txt)return;
  if(NATIVE&&nat('speak',txt,VOICE[S.lang])!==undefined)return;
  try{const u=new SpeechSynthesisUtterance(txt);u.lang=VOICE[S.lang];u.rate=.92;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function stopSpeak(){nat('stopSpeak');try{speechSynthesis.cancel()}catch(e){}}
function buzz(pattern){if(!S.vib)return;const p=Array.isArray(pattern)?pattern:[pattern];
  if(NATIVE&&nat('vibratePattern',p.join(','))!==undefined)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
let WAKE=null;
async function keepAwake(on){nat('keepAwake',!!on);try{if(on&&navigator.wakeLock&&!WAKE){WAKE=await navigator.wakeLock.request('screen')}else if(!on&&WAKE){await WAKE.release();WAKE=null}}catch(e){WAKE=null}}

const OPEN_WHEN_LOCKED=['callme','onthego','body','sounds','help','krise','alarm','ex','card','helfer','lock','setup'];

function go(name,params={}){
  if(name==='home'&&!S.setup)name='setup';
  if(S.pin&&!UNLOCKED&&!OPEN_WHEN_LOCKED.includes(name)){params={next:name};name='lock'}
  if(!DIARY_VIEWS.includes(name)&&name!=='dlock')DIARY_OPEN=false;
  if(S.diaryPin&&!DIARY_OPEN&&DIARY_VIEWS.includes(name)&&name!=='lock'){params={next:name};name='dlock';PINBUF=''}
  GEN++;clearTimers();stopSpeak();keepAwake(false);if(name!=='ex')SOUND.stop(true);REC.stopPlay();if(REC.mr&&REC.mr.state==='recording')REC.stop();V=Object.assign({name},params);render();window.scrollTo(0,0)}
window.ankerBack=function(){if(V.name==='news'&&!V.all){S.seenVersion=APP_VERSION;save()}if(V.name==='home'&&HOMETAB!=='hilfe'){HOMETAB='hilfe';render();return 'true'}if(V.name==='home'||V.name==='setup'||V.name==='lock')return 'false';if(V.name==='alarm'&&V.phase==='count'){cancelAlarm();return 'true'}go('home');return 'true'};

const FACES=['😣','😕','😐','🙂','😊'];
function todayCheck(){return S.checks.find(c=>c.d===dayKey())}
function lowTrend(){
  const map={};S.checks.forEach(c=>map[c.d]=c.n);
  const day=864e5;let start=map[dayKey()]!=null?0:1;let n=0;
  for(let i=start;i<start+3;i++){const k=dayKey(Date.now()-i*day);if(map[k]!=null&&map[k]<=2)n++;else break}
  return n>=3;
}

}

/* Übungen für zu Hause: erst üben, ab UNLOCK Durchgängen auch im Notfall */
const HOMEEX=['schublade','traum','bilder'],UNLOCK=3;
const HOMEFIT={panik:['bilder','traum'],gedanken:['schublade','bilder'],wut:['schublade','bilder'],leere:['bilder','traum'],anders:['schublade','bilder','traum']};
function pc(k){return (S.practice&&S.practice[k])||0}
function unlocked(k){return S.lang==='de'&&pc(k)>=UNLOCK}
function countPractice(k){S.practice=Object.assign({},S.practice);const b=pc(k);S.practice[k]=b+1;save();return b<UNLOCK&&b+1>=UNLOCK}
function withHome(base,w){const fit=(HOMEFIT[w]||[]).filter(unlocked).sort((a,b)=>pc(b)-pc(a));if(!fit.length)return base;const p=base.slice();p.splice(1,0,fit[0]);return p.slice(0,3)}
const PLANS={panik:['atem','g54321','muskel'],gedanken:['g54321','rechnen','atem'],wut:['muskel','atem','skill'],leere:['g54321','skill','atem'],anders:['atem','g54321','skill']};

async function helpFlow(){
  H={before:null,after:null,what:null,ex:[],start:Date.now()};
  await bot(t('greet'),300);
  await bot(t('askLevel'));
  const lvl=await askLevel(); H.before=lvl;
  if(lvl>=10){await bot(t('alarmNow'));await sleep(700);logDiary(true);return go('alarm',{from:'help'})}
  await bot(t('askWhat'));
  const w=await ask(['panik','gedanken','wut','leere','krise','anders'].map(k=>({label:t('w_'+k),v:k})));
  H.what=w;
  if(w==='krise'){logDiary(false);return go('krise')}
  if(lvl<=3) await bot(t('early'));
  if(S.lang==='de'){
    if(lvl>=7&&lvl<=9&&S.contacts.length){const c=S.contacts[0];
      await bot(sv(`Soll ich ${esc(c.name)} bitten, dich anzurufen? Das ist kein Alarm, nur eine kurze Nachricht.`,`Soll ich ${esc(c.name)} bitten, Sie anzurufen? Das ist kein Alarm, nur eine kurze Nachricht.`));
      if(await ask([{label:'Ja, bitte',v:true},{label:'Nein',v:false}])){const r=sendCallMe(c);await bot(callMeResult(c,r),300)}}
    if(w==='panik')await bot(sv('Kurz zur Info: Was du gerade spürst, ist Adrenalin. Es fühlt sich schlimm an, ist aber nicht gefährlich und geht vorbei.','Kurz zur Info: Was Sie gerade spüren, ist Adrenalin. Es fühlt sich schlimm an, ist aber nicht gefährlich und geht vorbei.'));
    if(S.voiceN)await voiceInFlow();
  }
  const plan=withHome(PLANS[w],w);
  for(let i=0;i<plan.length;i++){
    const ex=plan[i];H.ex.push(ex);
    const home=HOMEEX.includes(ex);
    await bot((home?`<b>${EXINFO[ex].name()}</b>: ${v(`Die hast du schon ${pc(ex)}-mal geübt. Das kannst du!`,`Diese Übung hast du schon ${pc(ex)}-mal geübt.`,`Diese Übung haben Sie schon ${pc(ex)}-mal geübt.`)} `:'')+EXINFO[ex].intro());
    const full=await RUN[ex](exBox());
    if(home&&full!==false)countPractice(ex);
    if(!home)markEx(ex);
    await bot(t('askNow'));
    const now=await askLevel(); H.after=now;
    if(now>=10){await bot(t('alarmNow'));await sleep(700);logDiary(true);return go('alarm',{from:'help'})}
    if(now<=3)break;
    if(i<plan.length-1){
      await bot(now<H.before?t('progress',H.before,now):t('notYet'));
      const go2=await ask([{label:t('yes'),v:true},{label:t('no'),v:false}]);
      if(!go2)break;
    }
  }
  logDiary(false);
  const b=H.before,a=H.after;
  await bot(a<b?t('better',b,a):t('worse'));
  if(a>=6) await bot(`<b>${t('callNowT')}</b>${contactCallList()}<div style="margin-top:8px">${hotlinesHTML()}</div>`);
  const next=await ask([{label:t('toHome'),v:'home'},{label:t('more'),v:'more'},...(a>=6?[{label:t('t_card'),v:'card'},{label:t('alarmBtn'),v:'alarm',cls:'danger'}]:[])]);
  if(next==='home')go('home');
  else if(next==='alarm')go('alarm',{from:'help'});
  else if(next==='card')go('card');
  else {await bot(t('which'));const e=await ask(Object.keys(EXINFO).filter(k=>!HOMEEX.includes(k)||unlocked(k)).map(k=>({label:EXINFO[k].name(),v:k})));await bot(EXINFO[e].intro());const full=await RUN[e](exBox());if(HOMEEX.includes(e)&&full!==false)countPractice(e);await bot(t('goodJob'));await ask([{label:t('toHome'),v:1}]);go('home')}
}
function contactCallList(){
  if(!S.contacts.length)return '';
  return '<div class="stack" style="margin-top:8px">'+S.contacts.map(c=>`<div class="hot"><div><div class="small muted">${esc(c.name)}</div><div class="num">${esc(c.num)}</div></div><a class="btn soft" href="tel:${esc(digits(c.num))}">${ICON.phone}${t('call')}</a></div>`).join('')+'</div>';
}
function logDiary(alarm){
  S.diary.unshift({t:H.start||Date.now(),before:H.before,after:H.after,what:H.what,ex:H.ex.slice(),alarm:!!alarm});
  S.diary=S.diary.slice(0,400);save();
}

const RUN={};
RUN.atem=(box,rounds=6)=>new Promise(res=>{
  box.innerHTML=`<div class="breath"><div class="ring"><div class="orb"></div><div class="blabel">${t('ready')}<span></span></div></div><div class="muted small" data-c></div>
   <div class="row" style="justify-content:center"><button class="iconbtn" data-vib aria-pressed="${S.vib}">📳 ${t('vib')}</button><button class="iconbtn" data-voice aria-pressed="${S.voice}">🔊 ${t('voice')}</button></div>
   <p class="small muted" style="text-align:center">${t('i_vib')}</p>${S.lang==='de'?soundBar():''}
   <button class="ghost" data-done>${t('done')}</button></div>`;
  const orb=box.querySelector('.orb'),lab=box.querySelector('.blabel'),cnt=box.querySelector('[data-c]');
  box.querySelector('[data-vib]').onclick=e=>{S.vib=!S.vib;save();e.currentTarget.setAttribute('aria-pressed',S.vib)};
  box.querySelector('[data-voice]').onclick=e=>{S.voice=!S.voice;save();e.currentTarget.setAttribute('aria-pressed',S.voice);if(!S.voice)stopSpeak()};
  keepAwake(true);
  let r=0,phase=-1,left=0,ended=false,id;
  const PH=[{k:'inhale',d:4,s:1},{k:'exhale',d:6,s:.45}];
  function setPhase(p){phase=p;left=PH[p].d;orb.style.transition=`transform ${PH[p].d}s ease-in-out`;orb.style.transform=`scale(${PH[p].s})`;lab.innerHTML=`${t(PH[p].k)}<span>${left}</span>`;
    if(p===0)buzz([250,750,250,750,250,750,250]);speak(t(PH[p].k))}
  function end(){if(ended)return;ended=true;clearInterval(id);keepAwake(false);orb.style.transform='scale(.45)';lab.innerHTML=t('wellDone')+'<span></span>';const d=box.querySelector('[data-done]');if(d)d.remove();res()}
  box.querySelector('[data-done]').onclick=end;
  later(()=>{r=1;cnt.textContent=t('round',1,rounds);setPhase(0);id=every(()=>{if(ended)return;left--;if(left>0){lab.querySelector('span').textContent=left;return}
    if(phase===0)setPhase(1);else{if(r>=rounds)return end();r++;cnt.textContent=t('round',r,rounds);setPhase(0)}},1000)},900);
});
RUN.g54321=(box)=>new Promise(res=>{
  const steps=[5,4,3,2,1].map(n=>({n,q:t('g'+n),p:t('p'+n)}));
  const praise=t('praise');
  let si=0,items=[];
  function draw(fb=''){const s=steps[si];
    box.innerHTML=`<div class="dots">${Array.from({length:s.n},(_,i)=>`<i class="${i<items.length?'on':''}"></i>`).join('')}</div>
    <p>${s.q}</p>${fb?`<p class="muted small">${fb}</p>`:''}
    <div class="chips">${items.map(x=>`<span>${esc(x)}</span>`).join('')}</div>
    <form class="row" data-f><input id="g-in" placeholder="${esc(s.p)}" autocomplete="off" style="flex:1;min-width:0"><button type="submit">OK</button></form>
    <button class="ghost" data-skip>${t('skip')}</button>`;
    if(!fb)speak(s.q);
    const inp=box.querySelector('#g-in');try{inp.focus({preventScroll:true})}catch(e){}
    box.querySelector('[data-f]').onsubmit=e=>{e.preventDefault();const tx=inp.value.trim();if(!tx){inp.focus();return}items.push(tx);if(items.length>=s.n)next();else draw(praise[items.length%praise.length])};
    box.querySelector('[data-skip]').onclick=next;}
  function next(){si++;items=[];if(si>=steps.length){box.innerHTML=`<p><b>${t('exDone')}</b></p>`;return res()}draw(t('next'))}
  draw();
});
RUN.rechnen=(box)=>new Promise(res=>{
  let cur=100,ok=0;const need=6;
  function draw(fb=''){box.innerHTML=`<div class="big">${cur} − 7 = ?</div>${fb?`<p class="muted">${fb}</p>`:''}
    <form class="row" data-f><input id="r-in" type="number" inputmode="numeric" style="flex:1;min-width:0" aria-label="Ergebnis"><button type="submit">OK</button></form>
    <p class="small muted">${t('okOf',ok,need)}</p><button class="ghost" data-skip>${t('done')}</button>`;
    const inp=box.querySelector('#r-in');try{inp.focus({preventScroll:true})}catch(e){}
    box.querySelector('[data-f]').onsubmit=e=>{e.preventDefault();const n=parseInt(inp.value,10);if(isNaN(n))return;const right=cur-7;
      if(n===right){ok++;cur=right;if(ok>=need)return done();draw(t('right'))}
      else{cur=right;draw(t('wrong',right))}};
    box.querySelector('[data-skip]').onclick=done;}
  function done(){box.innerHTML=`<p><b>${t('exDone')}</b></p>`;res()}
  draw();
});
RUN.muskel=(box)=>new Promise(res=>{
  const parts=['m_hands','m_shoulders','m_face','m_legs'].map(k=>t(k));
  let pi=0,ph='an',left=5,ended=false,id;
  function draw(){box.innerHTML=`<p class="small muted">${t('part',pi+1,parts.length)}</p><h3>${parts[pi]}</h3>
    <div class="big" style="color:${ph==='an'?'var(--alarm)':'var(--ok)'}">${ph==='an'?t('tense'):t('release')}<br>${left}</div>
    <p class="muted small">${ph==='an'?t('tenseHint'):t('releaseHint')}</p>
    <button class="ghost" data-skip>${t('done')}</button>`;box.querySelector('[data-skip]').onclick=end}
  function end(){if(ended)return;ended=true;clearInterval(id);box.innerHTML=`<p><b>${t('exDone')}</b></p>`;res()}
  draw();speak(parts[0]+'. '+t('tense'));buzz(200);
  id=every(()=>{if(ended)return;left--;if(left<=0){if(ph==='an'){ph='los';left=10;speak(t('release'));buzz([80,80,80])}else{pi++;if(pi>=parts.length)return end();ph='an';left=5;speak(parts[pi]+'. '+t('tense'));buzz(200)}}draw()},1000);
});
RUN.skill=(box)=>new Promise(res=>{
  if(S.lang!=='de')return RUN.atem(box).then(res);
  const all=allSkills();const fav=all.filter(s=>S.skillFav.includes(s.t));
  const pool=(fav.length>=3?fav:fav.concat(shuffle(all.filter(s=>!S.skillFav.includes(s.t)&&s.c!=='Kontakt')))).slice(0,4);

    box.innerHTML=`<p>${sv('Wohin soll die Reise gehen?','Wohin soll die Reise gehen?')}</p>

      <div class="row" style="justify-content:center"><button class="iconbtn" data-voice aria-pressed="${S.voice}">🔊 ${t('voice')}</button><button class="iconbtn" data-next>Weiter</button></div>${soundBar()}

    function show(){txt.style.opacity=0;later(()=>{txt.innerHTML=steps[i];txt.style.opacity=1;speak(steps[i])},400);dots.forEach((d,j)=>d.classList.toggle('on',j<=i));left=D+(i===steps.length-2?8:0);bar.style.transition='none';bar.style.width='0';later(()=>{bar.style.transition=`width ${left}s linear`;bar.style.width='100%'},50)}
    function next(){i++;if(i>=steps.length)return end(true);show()}
    function end(full){if(ended)return;ended=true;clearInterval(id);keepAwake(false);stopSpeak();
      box.innerHTML=`<p><b>${full?sv('Willkommen zurück.','Willkommen zurück.'):t('exDone')}</b></p><p class="muted">${sv('Dein sicherer Ort bleibt da. Du kannst jederzeit wieder hinreisen.','Ihr sicherer Ort bleibt da. Sie können jederzeit wieder hinreisen.')}</p>`;res(full||i>=4)}
    box.querySelector('[data-next]').onclick=next;box.querySelector('[data-end]').onclick=()=>end(false);
    keepAwake(true);show();
    id=every(()=>{if(ended)return;left--;if(left<=0)next()},1000);
  }
  start();
});

RUN.bilder=(box)=>new Promise(res=>{
  const rounds=6,deck=shuffle(PICS).slice(0,rounds);let r=0,got=0,ended=false;
  const sv=(du,sie)=>v(du,du,sie);
  function round(){
    if(ended)return;
    const [emo,name]=deck[r];const opts=shuffle([[emo,name],...shuffle(PICS.filter(p=>p[1]!==name)).slice(0,3)]);
    let blur=30,stage=0,done=false,id;

      <div class="guess">${opts.map(o=>`<button data-n="${esc(o[1])}">${esc(o[1])}</button>`).join('')}</div><button class="ghost" data-end>${t('done')}</button>`;
    const img=box.querySelector('.pic span'),fb=box.querySelector('[data-fb]');
    id=every(()=>{if(done)return;stage++;blur=Math.max(0,blur-4);img.style.filter=`blur(${blur}px)`;if(blur===0)clearInterval(id)},1400);
    box.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{if(done||b.classList.contains('no'))return;
      if(b.dataset.n===name){done=true;clearInterval(id);got++;img.style.filter='none';b.classList.add('ok');buzz(60);
        const lob=blur>=18?sv('Wow, so früh erkannt!','Sehr früh erkannt!'):blur>=8?sv('Richtig, gut hingeschaut!','Richtig.'):sv('Richtig!','Richtig.');
        fb.textContent=lob;speak(lob);r++;later(()=>r>=rounds?end(true):round(),1700)}
      else{b.classList.add('no');fb.textContent=sv('Noch nicht. Schau weiter genau hin.','Noch nicht. Schauen Sie weiter genau hin.')}});
    box.querySelector('[data-end]').onclick=()=>end(r>=3);
  }
  function end(full){if(ended)return;ended=true;box.innerHTML=`<p><b>${t('exDone')}</b></p><p class="muted">${sv(`Du hast ${got} ${got===1?'Bild':'Bilder'} erkannt. Deine Aufmerksamkeit war gerade ganz im Hier und Jetzt.`,`Sie haben ${got} ${got===1?'Bild':'Bilder'} erkannt. Ihre Aufmerksamkeit war gerade ganz im Hier und Jetzt.`)}</p>`;res(full)}
  round();
});
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

  ALARM.id=every(()=>{ALARM.left--;const n=$('#anum'),r=$('#aring');if(n)n.textContent=ALARM.left;if(r)r.style.setProperty('--p',(ALARM.left*10)+'%');if(ALARM.left<=3&&ALARM.left>0)buzz(150);if(ALARM.left<=0){clearInterval(ALARM.id);fireAlarm()}},1000);
}
function cancelAlarm(){clearInterval(ALARM.id);go('home')}
function alarmText(loc){
  return `Hier ist ${S.name||'jemand, der dich als Vertrauensperson eingetragen hat'}. Mir geht es gerade sehr schlecht (10 von 10). Bitte ruf mich sofort an oder komm vorbei.${loc?' Mein Standort: '+loc:''} So hilfst du: ${HELPER_URL} (Automatisch gesendet von meiner App Anker)`;
}
function timerText(loc,until){
  return `Hier ist ${S.name||'jemand, der dich als Vertrauensperson eingetragen hat'}. Ich wollte mich bis ${fmtTime(until)} Uhr melden und habe es nicht getan. Bitte ruf mich an oder schau nach mir.${loc?' Mein letzter Standort: '+loc:''} (Automatisch gesendet von meiner App Anker)`;
}
function getLoc(){return new Promise(res=>{if(!S.loc)return res('');
  const s=nat('getLocation');if(s!==undefined)return res(s?`https://maps.google.com/?q=${s}`:'');
  if(!navigator.geolocation)return res('');let done=false;const tt=setTimeout(()=>{if(!done){done=true;res('')}},4000);
  try{navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(tt);res(`https://maps.google.com/?q=${p.coords.latitude.toFixed(5)},${p.coords.longitude.toFixed(5)}`)},()=>{if(!done){done=true;clearTimeout(tt);res('')}},{timeout:3500,maximumAge:300000})}catch(e){done=true;clearTimeout(tt);res('')}})}
async function fireAlarm(){
  clearInterval(ALARM.id);V.phase='sent';
  const box=$('#alarmbox');if(!box)return;
  box.innerHTML=`<h1>${t('a_wait')}</h1>`;
  const loc=await getLoc();const msg=V.timerExpired?timerText(loc,V.timerExpired):alarmText(loc);ALARM.msg=msg;
  const res=[];let callTarget=null,waTarget=null;
  const list=V.onlyIds?V.onlyIds.map(i=>S.contacts[i]).filter(Boolean):S.contacts;
  for(const c of list){
    const wantsSms=c.how==='sms'||c.how==='both', wantsCall=c.how==='call'||c.how==='both';
    if(wantsSms){const ok=nat('sendSms',c.num,msg)===true;res.push({c,type:'sms',ok})}
    if(wantsCall&&!callTarget)callTarget=c;
    if(c.how==='wa'){res.push({c,type:'wa',ok:false});if(!waTarget)waTarget=c}
  }
  let callOk=false;
  if(NATIVE){if(callTarget)callOk=nat('call',callTarget.num)===true;else if(waTarget)nat('openUrl',waLink(waTarget))}
  showAlarmResult(res,callTarget,callOk);
}
function waLink(c,msg=ALARM.msg){return `https://wa.me/${intl(c.num)}?text=${encodeURIComponent(msg)}`}
function smsLink(c,msg=ALARM.msg){return `sms:${digits(c.num)}?body=${encodeURIComponent(msg)}`}
function showAlarmResult(res,callTarget,callOk){
  const box=$('#alarmbox');if(!box)return;
  const rows=res.map(r=>{
    if(r.type==='sms')return r.ok?`<div class="status ok">${t('smsSent',esc(r.c.name))}</div>`
      :`<div class="status wait"><div>${t('smsPrep',esc(r.c.name))}</div><a class="btn soft wide" style="margin-top:8px" href="${smsLink(r.c)}">${t('openSms')}</a></div>`;
    return `<div class="status wait"><div>${t('waPrep',esc(r.c.name))}</div><a class="btn soft wide" style="margin-top:8px" href="${waLink(r.c)}" target="_blank" rel="noopener">${t('openWa')}</a></div>`;
  }).join('');
  const call=callTarget?(callOk?`<div class="status ok">${t('calling',esc(callTarget.name))}</div>`
    :`<div class="status wait"><div>${t('callWho',esc(callTarget.name))} <span class="num">${esc(callTarget.num)}</span></div><a class="btn danger wide" style="margin-top:8px" href="tel:${esc(digits(callTarget.num))}">${t('callBtn')}</a></div>`):'';
  box.innerHTML=`<h1>${t('a_sent')}</h1>
    ${rows}${call}
    ${!NATIVE?`<p class="small muted">${t('noNative')}</p>`:''}
    <details class="card"><summary>${t('msgShown')}</summary><p class="small">${esc(ALARM.msg)}</p></details>
    <div class="card"><h3>${t('a_112').replace(/<[^>]+>/g,'')}</h3>${hotlinesHTML()}</div>
    <button class="soft" data-a="ex" data-v="atem">${t('breatheWait')}</button>
    <button class="ghost" data-a="go" data-v="card">${t('t_card')}</button>
    <button class="ghost" data-a="all-clear">${t('clear')}</button>`;
}
async function allClear(){
  const msg=`Hier ist ${S.name||'ich'}. Entwarnung: Mir geht es wieder etwas besser. Danke, dass du da bist. (Anker)`;
  const box=$('#alarmbox');const out=[];

/* ---- Bericht ---- */
function reportData(days=30){
  const from=Date.now()-days*864e5;
  const d=S.diary.filter(e=>e.t>=from);
  const helps=d.filter(e=>e.before!=null&&e.what!=='notiz'&&e.what!=='gedanke');
  const withAfter=helps.filter(e=>e.after!=null);
  const avg=a=>a.length?(a.reduce((s,x)=>s+x,0)/a.length):null;
  const whatCount={};helps.forEach(e=>{if(e.what)whatCount[e.what]=(whatCount[e.what]||0)+1});
  const exDrop={};withAfter.forEach(e=>{const ex=(e.ex||[])[0];if(!ex)return;(exDrop[ex]=exDrop[ex]||[]).push(e.before-e.after)});
  const bestEx=Object.entries(exDrop).map(([k,a])=>[k,avg(a)]).sort((a,b)=>b[1]-a[1])[0];
  const checks=S.checks.filter(c=>new Date(c.d).getTime()>=from-864e5);
  const hours={morgens:0,mittags:0,abends:0,nachts:0};helps.forEach(e=>{const h=new Date(e.t).getHours();hours[h<6?'nachts':h<12?'morgens':h<18?'mittags':h<23?'abends':'nachts']++});
  return {days,helps,withAfter,
    avgBefore:avg(helps.map(e=>e.before)),avgAfter:avg(withAfter.map(e=>e.after)),
    improved:withAfter.filter(e=>e.after<e.before).length,alarms:d.filter(e=>e.alarm).length,
    whatCount,bestEx,checks,avgCheck:avg(checks.map(c=>c.n)),hours,
    thoughts:d.filter(e=>e.what==='gedanke'),notes:d.filter(e=>e.note)};
}
function reportText(r){
  const f=x=>x==null?'–':x.toFixed(1).replace('.',',');
  let s=`Anker-Bericht${S.name?' von '+S.name:''}, letzte ${r.days} Tage (Stand ${new Date().toLocaleDateString('de-DE')})\n\n`;
  s+=`Akute Momente: ${r.helps.length}\nØ Belastung vorher: ${f(r.avgBefore)} von 10, nachher: ${f(r.avgAfter)} von 10\nBesser geworden: ${r.improved} von ${r.withAfter.length}\nAlarme an Vertrauenspersonen: ${r.alarms}\n`;
  const w=Object.entries(r.whatCount).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`${WHAT[k]} (${n}×)`).join(', ');if(w)s+=`Häufigste Belastung: ${w}\n`;
  if(r.bestEx)s+=`Hilft am meisten: ${EXNAME[r.bestEx[0]]} (Ø ${f(r.bestEx[1])} Punkte weniger)\n`;
  s+=`Tageszeit: morgens ${r.hours.morgens}, mittags ${r.hours.mittags}, abends ${r.hours.abends}, nachts ${r.hours.nachts}\n`;
  if(r.checks.length)s+=`Tägliche Stimmung (1–5): Ø ${f(r.avgCheck)} an ${r.checks.length} Tagen\n`;
  if(r.thoughts.length)s+=`Gedanken-Checks: ${r.thoughts.length}\n`;
  if(r.notes.length){s+=`\nNotizen:\n`;r.notes.slice(0,15).forEach(e=>s+=`- ${new Date(e.t).toLocaleDateString('de-DE')}: ${e.note.replace(/\n/g,' ')}\n`)}
  return s;
}

  ${w.length?`<div class="card"><h3>Was am häufigsten belastet</h3><ul>${w.map(([k,n])=>`<li>${WHAT[k]}: ${n}×</li>`).join('')}</ul></div>`:''}

  ${r.notes.length?`<div class="card"><h3>Notizen</h3>${r.notes.slice(0,15).map(e=>`<div class="entry"><b class="small">${fmtDate(e.t)}</b><span class="small">${esc(e.note).replace(/\n/g,'<br>')}</span></div>`).join('')}</div>`:''}
  ${!r.helps.length&&!ck.length?'<p class="muted">Noch keine Daten in diesem Zeitraum. Nutze den Hilfe-Knopf oder den täglichen Check, dann füllt sich der Bericht.</p>':''}
  <div class="row noprint"><button style="flex:1" data-a="report-print">Als PDF speichern</button><button class="ghost" style="flex:1" data-a="report-share">Als Text teilen</button></div>

function stepList(){
  const base=S.age==='kind'?['Einem anderen Kind Hallo sagen','Im Unterricht einmal aufzeigen','In der Pause jemanden fragen, ob ich mitspielen darf','Beim Bäcker selbst bestellen','Jemandem etwas Nettes sagen']
   :S.age==='jugend'?['Jemandem aus der Klasse Hallo sagen','Im Unterricht einmal etwas sagen','Einer Person eine Nachricht schreiben','Beim Bäcker selbst bestellen','10 Minuten an einem Ort mit Menschen sein','Jemandem ein Kompliment machen']
   :['Einer Person im Haus Hallo sagen','Beim Bäcker oder an der Kasse kurz plaudern','Einer Person eine Nachricht schreiben','10 Minuten an einem Ort mit Menschen sein (Park, Café)','Jemandem eine Frage stellen','Einen Termin selbst telefonisch machen'];
  return base.concat(S.stepsOwn);
}
VIEWS.steps=()=>{
  const l=stepList(),done=l.filter(x=>S.stepsDone[x]).length;
  return `${topbar(t('t_steps'))}
  <p class="muted">${v("Kleine Mutproben, ganz ohne Druck. Jeder Haken zählt, auch wenn's nur einer pro Woche ist.",'Kleine Übungen für mehr Sicherheit unter Menschen. Wähle selbst, was heute passt. Es gibt keinen Druck.','Kleine Übungen für mehr Sicherheit unter Menschen. Wählen Sie selbst, was heute passt. Es gibt keinen Druck.')}</p>
  ${done?`<div class="note">${v(`Du hast schon ${done} Schritt${done>1?'e':''} geschafft. Echt stark!`,`Du hast ${done} Schritt${done>1?'e':''} geschafft.`,`Sie haben ${done} Schritt${done>1?'e':''} geschafft.`)}</div>`:''}
  <div class="card">${l.map(x=>`<label class="check"><input type="checkbox" data-a="step" data-v="${esc(x)}" ${S.stepsDone[x]?'checked':''}><span style="flex:1">${esc(x)}</span>${S.stepsOwn.includes(x)?`<button class="iconbtn" data-a="del-step" data-v="${esc(x)}">Löschen</button>`:''}</label>`).join('')}</div>
  <div class="card"><h3>Eigenen Schritt hinzufügen</h3><form class="row" data-f="step"><input id="st-new" placeholder="z. B. Im Verein vorbeischauen" style="flex:1;min-width:0"><button type="submit">Hinzufügen</button></form></div>

VIEWS.train=()=>{
  if(V.scene!=null)return `${topbar(t('t_train'))}<div id="chat"></div><div id="acts"></div>`;
  const list=SCENES.filter(s=>s.ages.includes(S.age));
  return `${topbar(t('t_train'))}
  <p class="muted">${v('Übe schwierige Gespräche hier, wo nichts schiefgehen kann. Ich spiele die andere Person, du wählst eine Antwort oder schreibst deine eigene.','Hier kannst du schwierige Gespräche in Ruhe üben. Anker spielt die andere Person, du wählst eine Antwort oder formulierst deine eigene.','Hier können Sie schwierige Gespräche in Ruhe üben. Anker spielt die andere Person, Sie wählen eine Antwort oder formulieren Ihre eigene.')}</p>
  ${list.map(s=>`<button class="choicecard" data-a="scene" data-v="${s.id}"><b>${s.title}</b><span class="muted">${s.intro}</span></button>`).join('')}`;
};
async function runScene(){
  const sc=SCENES.find(s=>s.id===V.scene);if(!sc)return;
  await bot(`<i>${sc.intro}</i>`,200);
  for(const st of sc.steps){
    await bot(`<b>${esc(st.o)}</b>`);
    const own='__own';
    const pick=await new Promise(res=>{const a=$('#acts');a.innerHTML='';
      st.a.forEach(x=>{const b=el('button','choice',esc(x));b.onclick=()=>{a.innerHTML='';me(x);res(x)};a.appendChild(b)});
      const f=el('form','row');f.innerHTML='<input id="own-in" placeholder="Oder eigene Antwort schreiben" style="flex:1;min-width:0"><button type="submit">OK</button>';
      f.onsubmit=e=>{e.preventDefault();const x=$('#own-in').value.trim();if(!x)return;a.innerHTML='';me(x);res(own)};a.appendChild(f);scrollEnd()});
    await bot(`${pick===own?v('Gute eigene Antwort!','Gut formuliert.','Gut formuliert.')+' ':''}💡 ${esc(st.tip)}`);
  }
  await bot(`<b>${esc(sc.end)}</b>`);
  S.diary.unshift({t:Date.now(),before:null,after:null,what:'training',ex:[],note:'Geübt: '+sc.title});save();
  const n=await ask([{label:'Anderes Gespräch üben',v:'list'},{label:t('toHome'),v:'home'}]);
  if(n==='list')go('train');else go('home');
}

const TQ=[
 {k:'thought',q:()=>v('Welcher Gedanke macht dir gerade zu schaffen?','Welcher Gedanke belastet dich gerade?','Welcher Gedanke belastet Sie gerade?'),p:'z. B. Alle finden mich komisch.'},
 {k:'belief1',q:()=>v('Wie sehr glaubst du den Gedanken gerade?','Wie stark glaubst du diesen Gedanken im Moment?','Wie stark glauben Sie diesen Gedanken im Moment?'),slider:true},
 {k:'pro',q:()=>v('Was spricht dafür?','Was spricht für diesen Gedanken?','Was spricht für diesen Gedanken?'),p:'z. B. Gestern hat niemand mit mir geredet.'},
 {k:'contra',q:()=>v('Und was spricht dagegen? Gab es Momente, in denen es anders war?','Was spricht dagegen? Gab es Situationen, in denen es anders war?','Was spricht dagegen? Gab es Situationen, in denen es anders war?'),p:'z. B. Lena hat mich letzte Woche zum Essen eingeladen.'},
 {k:'friend',q:()=>v('Was würdest du einem guten Freund sagen, der so denkt?','Was würdest du einer guten Freundin oder einem guten Freund sagen, die oder der so denkt?','Was würden Sie einem guten Freund sagen, der so denkt?'),p:'z. B. Du bist nicht komisch, du warst nur müde.'},
 {k:'new',q:()=>v('Wie könnte ein freundlicherer Gedanke klingen, der trotzdem ehrlich ist?','Wie könnte ein hilfreicher, realistischer Gedanke lauten?','Wie könnte ein hilfreicher, realistischer Gedanke lauten?'),p:'z. B. Manche kennen mich noch nicht gut. Das kann sich ändern.'},
 {k:'belief2',q:()=>v('Und wie sehr glaubst du den alten Gedanken jetzt?','Wie stark glaubst du den ursprünglichen Gedanken jetzt?','Wie stark glauben Sie den ursprünglichen Gedanken jetzt?'),slider:true}
];
VIEWS.thought=()=>{
  const i=V.i||0,A=V.ans||{};
  if(i>=TQ.length){
    const d=(A.belief1??0)-(A.belief2??0);
    return `${topbar(t('t_thought'))}<div class="card"><h3>Dein Ergebnis</h3>
    <p><b>Alter Gedanke:</b> ${esc(A.thought)}</p><p><b>Neuer Gedanke:</b> ${esc(A.new||'–')}</p>
    <p>Glaube an den alten Gedanken: <b>${A.belief1??0} %</b> → <b>${A.belief2??0} %</b></p>
    <p>${d>0?v(`${d} Prozentpunkte weniger. Gedanken sind keine Tatsachen!`,`${d} Prozentpunkte weniger. Gedanken sind keine Tatsachen.`,`${d} Prozentpunkte weniger. Gedanken sind keine Tatsachen.`):v('Manchmal bleibt ein Gedanke hartnäckig. Schon das Hinschauen ist ein Schritt.','Manche Gedanken sind hartnäckig. Schon das genaue Hinsehen ist ein wichtiger Schritt.','Manche Gedanken sind hartnäckig. Schon das genaue Hinsehen ist ein wichtiger Schritt.')}</p></div>
    <p class="small muted">Das Ergebnis steht jetzt in deinem Tagebuch.</p>
    <button data-a="home">${t('toHome')}</button><button class="ghost" data-a="thought-new">Noch einen Gedanken prüfen</button>`;
  }
  const q=TQ[i];
  return `${topbar(t('t_thought'))}
  <div class="progress">${TQ.map((_,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}</div>
  ${i===0?`<p class="muted">${v('Angst macht aus Gedanken schnell Tatsachen. Hier prüfen wir einen davon in Ruhe.','Angst lässt Gedanken oft wie Tatsachen wirken. Hier prüfst du einen davon Schritt für Schritt.','Angst lässt Gedanken oft wie Tatsachen wirken. Hier prüfen Sie einen davon Schritt für Schritt.')}</p>`:`<div class="say small"><b>Gedanke:</b> ${esc(A.thought)}</div>`}
  <h2>${q.q()}</h2>
  ${q.slider?`<div class="field"><input id="tq" type="range" min="0" max="100" step="5" value="${A[q.k]??50}" oninput="this.nextElementSibling.textContent=this.value+' %'"><span class="big" style="font-size:2rem">${A[q.k]??50} %</span></div>`
   :`<textarea id="tq" placeholder="${esc(q.p)}">${esc(A[q.k]||'')}</textarea>`}
  <p id="tq-err" class="small" style="color:var(--alarm)" hidden>Schreib bitte wenigstens ein paar Worte.</p>
  <div class="row">${i>0?'<button class="ghost" data-a="thought-back">Zurück</button>':''}<button style="flex:1" data-a="thought-next">${i===TQ.length-1?'Fertig':'Weiter'}</button></div>`;
};

VIEWS.helfer=()=>`${S.setup?topbar('Für Vertrauenspersonen'):`<div class="top"><div class="brand">${ICON.anchor}Anker</div>${''}</div>`}
  <h1>Du wurdest als Vertrauensperson eingetragen</h1>
  <p>Jemand nutzt die App Anker, die in Momenten mit Panik, starker Anspannung oder Krisen hilft. Wenn du eine Alarm-Nachricht bekommst, geht es der Person gerade sehr schlecht und sie möchte, dass du dich meldest.</p>
  <div class="card"><h3>Was jetzt hilft</h3><ol>
   <li><b>Sofort zurückrufen.</b> Wenn niemand abnimmt, mehrmals versuchen. Wenn möglich, hinfahren. Ein Standort-Link in der Nachricht zeigt, wo die Person ist.</li>
   <li><b>Ruhig bleiben und langsam sprechen.</b> Frag: „Wo bist du? Bist du gerade sicher?“</li>
   <li><b>Zuhören statt bewerten.</b> Sätze wie „Reiß dich zusammen“ oder „Das ist doch nicht so schlimm“ machen es schwerer.</li>
   <li><b>Bei Panik:</b> Erinnere daran, dass eine Panikattacke vorbeigeht. Atmet gemeinsam langsam: 4 Sekunden ein, 6 Sekunden aus.</li>
   <li><b>Direkt nachfragen ist in Ordnung:</b> „Denkst du daran, dir etwas anzutun?“ Danach zu fragen erhöht das Risiko nicht. Es zeigt, dass du es ernst nimmst.</li>
   <li><b>Nicht allein lassen,</b> bis es besser ist oder andere Hilfe da ist.</li>
   <li><b>Bei Lebensgefahr</b> oder wenn du die Person nicht erreichst und dir große Sorgen machst: <b>112</b> anrufen.</li></ol></div>
  <div class="card"><h3>Kommt eine Entwarnung?</h3><p>Die Person kann in der App eine Entwarnung schicken. Melde dich trotzdem kurz, das tut gut.</p></div>
  <div class="card"><h3>Und du?</h3><p>Für jemanden da zu sein, kann belasten. Auch du darfst dir Unterstützung holen, zum Beispiel bei der TelefonSeelsorge: <b>0800 111 0 111</b> (kostenlos, rund um die Uhr).</p></div>
  ${!S.setup?'<button class="ghost" data-a="go" data-v="setup">Anker selbst einrichten</button>':''}`;

/* ============ Rendern & Aktionen ============ */
function render(){
  applyLang();applyLook();
  app.innerHTML=(VIEWS[V.name]||VIEWS.home)();
  if(V.name==='help')helpFlow();
  if(V.name==='ex')runSingle();
  if(V.name==='voice')renderVoiceList();
  if(V.name==='onthego'&&V.og)runOG();
  if(V.name==='alarm')startAlarm();
  if(V.name==='card')keepAwake(true);
  if(V.name==='train'&&V.scene!=null)runScene();
}
function addContact(){
  const n=$('#c-name').value.trim(),num=$('#c-num').value.trim(),how=$('#c-how').value,err=$('#c-err');
  if(!n||digits(num).replace('+','').length<5){err.textContent=!n?'Bitte gib einen Namen ein.':'Bitte gib eine gültige Telefonnummer ein.';err.hidden=false;return}
  S.contacts.push({name:n,num,how});save();render();
}
function act(a,d,e){
  switch(a){
    case 'home':return go('home');
    case 'set-font':S.fontSize=+d.v;save();return render();
    case 'set-theme':S.theme=d.v;save();return render();
    case 'v-rec':return voiceRecord();
    case 'v-stop':return voiceStop();
    case 'v-preview':if(RECT.blob)REC.play(RECT.blob);return;
    case 'v-save':return voiceSave();
    case 'v-play':IDB.all().then(a=>{const r=a.find(x=>x.id===d.i);if(r)REC.play(r.blob)});return;
    case 'v-del':IDB.del(d.i).then(()=>renderVoiceList());return;
    case 'callme-send':{const c=S.contacts[+d.i];if(!c)return;const r=sendCallMe(c);const box=$('#cm-res');if(box)box.insertAdjacentHTML('beforeend',callMeResult(c,r));e.disabled=true;return}
    case 'og':V.og=d.v||'';return render();
    case 'feel':V.f=d.v||'';V.w='';V.n=0;return render();
    case 'feel-w':V.w=d.v;return render();
    case 'feel-n':{V.n=+d.v;const f=FEEL.find(x=>x.k===V.f);S.diary.unshift({t:Date.now(),before:null,after:null,what:'gefuehl',ex:[],note:`Gefühl: ${f.n} – ${V.w} (Stärke ${V.n} von 5)`});save();return render()}
    case 'badge-ok':S.badgesSeen=earned();save();return render();
    case 'backup-make':return backupMake();
    case 'backup-pick':return backupPick();
    case 'backup-restore':return backupRestore();
    case 'fb-send':{const f=fbData();if(!f)return;const url=`${REPO}/issues/new?title=${encodeURIComponent(f.title)}&body=${encodeURIComponent(f.body)}&labels=${encodeURIComponent(f.ty==='Fehler'?'bug':f.ty==='Idee'?'enhancement':'question')}`;
      if(nat('openUrl',url)===undefined)window.open(url,'_blank','noopener');const m=$('#fb-msg');m.textContent='GitHub ist geöffnet. Dort noch auf „Submit new issue“ tippen. Danke!';m.hidden=false;return}
    case 'fb-copy':{const f=fbData();if(!f)return;const m=$('#fb-msg');(navigator.clipboard?navigator.clipboard.writeText(f.title+'\n\n'+f.body):Promise.reject()).then(()=>{m.textContent='Text kopiert. Du kannst ihn jetzt z. B. per WhatsApp schicken.';m.hidden=false}).catch(()=>{m.textContent=f.title+'\n\n'+f.body;m.style.whiteSpace='pre-wrap';m.hidden=false});return}
    case 'dpin':{if(d.v==='⌫')PINBUF=PINBUF.slice(0,-1);else if(PINBUF.length<4)PINBUF+=d.v;
      if(PINBUF.length===4){if(PINBUF===S.diaryPin){DIARY_OPEN=true;PINBUF='';return go(V.next||'diary')}PINBUF='';V.err=true}else V.err=false;return render()}
    case 'dpin-forgot':$('#dforgot').innerHTML=`<p class="small"><b>Wirklich? Alle Tagebuch-Einträge werden gelöscht.</b></p><div class="row"><button class="danger" style="flex:1" data-a="dpin-wipe">Ja, löschen</button><button class="ghost" data-a="home">Abbrechen</button></div>`;return;
    case 'dpin-wipe':S.diary=[];S.diaryPin='';save();DIARY_OPEN=true;return go('diary');
    case 'dpin-set':{const a=$('#dp-new').value,r=$('#dp-rep');const m=$('#dp-msg');m.hidden=false;m.style.color='var(--alarm)';

      S.diaryPin=a;DIARY_OPEN=true;save();render();const m2=$('#dp-msg');if(m2){m2.hidden=false;m2.style.color='var(--ok)';m2.textContent='PIN gespeichert. Merk sie dir gut.'}return}

    case 'news-all':return go('news',{all:true});
    case 'news-ok':S.seenVersion=APP_VERSION;save();return go('home');
    case 'tab':HOMETAB=d.v;render();return window.scrollTo(0,0);
    case 'go':return go(d.v);

    case 'set-lang':S.lang=d.v;save();return render();
    case 'setup-next':
      if(V.step===2){S.name=$('#f-name').value.trim()}
      if(V.step===6)readPlan();

    case 'set-tone':case 'tone2':S.tone=d.v;save();return render();

    case 'del-contact':S.contacts.splice(+d.i,1);if(S.timer){S.timer=null;scheduleNativeTimer()}save();return render();
    case 'toggle-loc':S.loc=e.checked;save();return;
    case 'voice':S.voice=!S.voice;save();e.setAttribute('aria-pressed',S.voice);if(!S.voice)stopSpeak();return;
    case 'check':{const n=+d.v;S.checks=S.checks.filter(c=>c.d!==dayKey());S.checks.push({d:dayKey(),n});S.checks=S.checks.slice(-400);save();V.justChecked=true;return render()}
    case 'card-close':keepAwake(false);return go('home');
    case 'timer-min':V.min=+d.v;return render();
    case 'timer-start':return startTimer();
    case 'timer-stop':S.timer=null;save();scheduleNativeTimer();return go('home');
    case 'timer-add':if(S.timer){S.timer.until+=15*60000;save();scheduleNativeTimer()}return render();
    case 'plan-edit':V.edit=true;return render();
    case 'plan-save':readPlan();V.edit=false;return render();
    case 'fav':{const i=S.skillFav.indexOf(d.v);if(i>=0)S.skillFav.splice(i,1);else S.skillFav.push(d.v);save();return render()}
    case 'del-skill':S.skillOwn=S.skillOwn.filter(x=>x!==d.v);S.skillFav=S.skillFav.filter(x=>x!==d.v);save();return render();

    case 'del-step':S.stepsOwn=S.stepsOwn.filter(x=>x!==d.v);delete S.stepsDone[d.v];save();return render();

    case 'diary-add':{const n=+$('#d-lvl').value,tx=$('#d-note').value.trim();S.diary.unshift({t:Date.now(),before:n,after:null,what:'notiz',ex:[],note:tx});save();return render()}
    case 'report-days':V.days=+d.v;return render();
    case 'report-print':{if(nat('printPage')!==undefined)return;try{window.print()}catch(x){}const m=$('#rep-msg');if(m){m.textContent='Falls sich kein Druckfenster öffnet: Öffne Anker im Browser oder in der Android-App und versuche es dort.';m.hidden=false}return}
    case 'report-share':{const tx=reportText(reportData(V.days||30));if(nat('share',tx)!==undefined)return;
      if(navigator.share){navigator.share({title:'Anker-Bericht',text:tx}).catch(()=>{});return}
      const m=$('#rep-msg');(navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).then(()=>{m.textContent='Der Bericht wurde als Text kopiert.';m.hidden=false}).catch(()=>{m.textContent=tx;m.style.whiteSpace='pre-wrap';m.hidden=false});return}
    case 'scene':return go('train',{scene:d.v});
    case 'thought-new':return go('thought');
    case 'thought-back':{saveTQ();V.i--;return render()}
    case 'thought-next':{const q=TQ[V.i||0];const val=$('#tq').value;if(!q.slider&&q.k==='thought'&&!val.trim()){$('#tq-err').hidden=false;return}
      saveTQ();V.i=(V.i||0)+1;if(V.i>=TQ.length){const A=V.ans;S.diary.unshift({t:Date.now(),before:null,after:null,what:'gedanke',ex:[],note:`Gedanke: ${A.thought}\nDafür: ${A.pro||'–'}\nDagegen: ${A.contra||'–'}\nNeuer Gedanke: ${A.new||'–'}\nGlaube: ${A.belief1??0} % → ${A.belief2??0} %`});save()}
      return render()}
    case 'alarm-cancel':return cancelAlarm();
    case 'alarm-now':clearInterval(ALARM.id);return fireAlarm();
    case 'all-clear':return allClear();
    case 'save-basic':{S.name=$('#f-name').value.trim();S.age=$('#f-age').value;S.lang=$('#f-lang').value;save();return render()}
    case 'save-card':S.cardText=$('#f-card').value.trim();if(S.cardText===CARD_DE)S.cardText='';save();return render();

    case 'set-remind':S.remind=e.checked;save();nat('setReminder',S.remind,S.remindHour);return;
    case 'set-rh':S.remindHour=+e.value;save();if(S.remind)nat('setReminder',true,S.remindHour);return;
    case 'set-discreet':S.discreet=e.checked;save();nat('setDiscreet',S.discreet);return render();
    case 'pin-on':{const p=$('#f-pin').value;if(!/^\d{4}$/.test(p)){$('#pin-msg').hidden=false;return}S.pin=p;UNLOCKED=true;save();return render()}

    case 'pin':{if(d.v==='⌫')PINBUF=PINBUF.slice(0,-1);else if(PINBUF.length<4)PINBUF+=d.v;

    case 'wipe':IDB.clear();nat('cancelTimer');nat('setReminder',false,20);if(S.discreet)nat('setDiscreet',false);S=clone(DEF);save();UNLOCKED=false;return go('setup',{step:0});

app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;act(b.dataset.a,b.dataset,b)});

function sv(du,sie){return v(du,du,sie)}

/* ---- Speicher für Sprachaufnahmen (IndexedDB) ---- */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);let r;try{r=indexedDB.open('anker',1)}catch(e){return rej(e)}
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('voice'))r.result.createObjectStore('voice',{keyPath:'id'})};
    r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
  async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('voice',mode);const st=tx.objectStore('voice');const q=fn(st);
    tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)})},
  all(){return this.run('readonly',st=>st.getAll()).then(x=>(x||[]).sort((a,b)=>b.t-a.t)).catch(()=>[])},
  put(o){return this.run('readwrite',st=>st.put(o))},
  del(id){return this.run('readwrite',st=>st.delete(id))},
  clear(){return this.run('readwrite',st=>st.clear()).catch(()=>{})}};
async function syncVoiceCount(){const a=await IDB.all();if(S.voiceN!==a.length){S.voiceN=a.length;save()}return a}

/* ---- Stimme zum Festhalten ---- */
const REC={mr:null,chunks:[],stream:null,blob:null,audio:null,url:null,
  async start(){this.stopPlay();this.chunks=[];this.blob=null;
    this.stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const types=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];const mime=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
    this.mr=new MediaRecorder(this.stream,mime?{mimeType:mime}:undefined);
    this.mr.ondataavailable=e=>{if(e.data&&e.data.size)this.chunks.push(e.data)};
    return new Promise(res=>{this.mr.onstop=()=>{this.blob=new Blob(this.chunks,{type:this.mr.mimeType||mime||'audio/webm'});this.stream.getTracks().forEach(t=>t.stop());res(this.blob)};this.mr.start()})},
  stop(){try{if(this.mr&&this.mr.state==='recording')this.mr.stop()}catch(e){}},
  play(blob,onEnd){this.stopPlay();this.url=URL.createObjectURL(blob);this.audio=new Audio(this.url);this.audio.onended=()=>{this.stopPlay();onEnd&&onEnd()};
    return this.audio.play().catch(()=>{onEnd&&onEnd()})},
  stopPlay(){try{if(this.audio){this.audio.pause();this.audio=null}if(this.url){URL.revokeObjectURL(this.url);this.url=null}}catch(e){}}};

let RECT={};
async function voiceRecord(){
  const ui=$('[data-recui]');if(!ui)return;
  if(!navigator.mediaDevices||!window.MediaRecorder){ui.innerHTML=`<p class="small" style="color:var(--alarm)">Aufnehmen geht auf diesem Gerät leider nicht.</p>`;return}
  let p;try{p=REC.start()}catch(e){p=null}
  try{await new Promise((ok,bad)=>{const c=setInterval(()=>{if(REC.mr&&REC.mr.state==='recording'){clearInterval(c);ok()}},100);setTimeout(()=>{clearInterval(c);bad()},8000);if(p)p.catch(bad)})}
  catch(e){ui.innerHTML=`<p class="small" style="color:var(--alarm)">Das Mikrofon ist nicht erlaubt. Bitte erlaube den Zugriff und versuche es noch einmal.</p><button class="danger wide" data-a="v-rec">● Nochmal versuchen</button>`;return}
  RECT={start:Date.now()};
  ui.innerHTML=`<div class="recdot"><i></i><span data-sec>0:00</span></div><button class="wide" data-a="v-stop">■ Aufnahme beenden</button>`;
  RECT.id=every(()=>{const s=Math.floor((Date.now()-RECT.start)/1000);const e=$('[data-sec]');if(e)e.textContent=`0:${String(s).padStart(2,'0')}`;if(s>=60)voiceStop()},250);
  p.then(blob=>{RECT.blob=blob;RECT.sec=(Date.now()-RECT.start)/1000;const u=$('[data-recui]');if(!u)return;

const SOUND={ctx:null,nodes:[],cur:'',
  noise(type){const c=this.ctx,len=c.sampleRate*4,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);let last=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;if(type==='brown'){last=(last+0.02*w)/1.02;d[i]=last*3.5}else d[i]=w}
    const s=c.createBufferSource();s.buffer=b;s.loop=true;return s},
  play(kind){this.stop(true);if(!kind)return;
    try{this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    const c=this.ctx;c.resume&&c.resume();const out=c.createGain();out.gain.value=0;out.connect(c.destination);
    const N=[out];const lfo=(freq,depth,target,base)=>{const o=c.createOscillator();o.frequency.value=freq;const g=c.createGain();g.gain.value=depth;o.connect(g);g.connect(target);target.value=base;o.start();N.push(o,g)};
    if(kind==='regen'){const s=this.noise('white');const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=900;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=7000;const g=c.createGain();g.gain.value=.22;s.connect(hp);hp.connect(lp);lp.connect(g);g.connect(out);s.start();N.push(s,hp,lp,g)}
    if(kind==='meer'){const s=this.noise('brown');const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;const g=c.createGain();s.connect(lp);lp.connect(g);g.connect(out);s.start();lfo(.09,.32,g.gain,.38);N.push(s,lp,g)}
    if(kind==='wind'){const s=this.noise('brown');const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=.9;const g=c.createGain();g.gain.value=.9;s.connect(bp);bp.connect(g);g.connect(out);s.start();lfo(.06,260,bp.frequency,520);N.push(s,bp,g)}
    out.gain.setTargetAtTime(.9,c.currentTime,1.2);this.nodes=N;this.cur=kind;this.sync()},
  stop(quick){const c=this.ctx,N=this.nodes;this.nodes=[];this.cur='';
    if(c&&N.length){N[0].gain.setTargetAtTime(0,c.currentTime,quick?.05:.4);setTimeout(()=>N.forEach(n=>{try{n.stop&&n.stop()}catch(e){}try{n.disconnect()}catch(e){}}),quick?200:1500)}this.sync()},
  sync(){document.querySelectorAll('[data-snd]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.snd===this.cur))}};
const SOUNDS=[['regen','🌧','Regen'],['meer','🌊','Meer'],['wind','🍃','Wind']];

  <div class="badgegrid">${BADGES.map(b=>{const [a,n]=b.p(),ok=a>=n;return `<div class="badge ${ok?'on':''}"><span class="be">${b.e}</span><b>${b.n}</b><span class="small muted">${b.d}</span>${ok?'':`<span class="small muted">${Math.min(a,n)} von ${n}</span>`}</div>`}).join('')}</div>`};

/* ---- Daten sichern ---- */
function blobToData(b){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res('');r.readAsDataURL(b)})}
function dataToBlob(d){const [h,b64]=d.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'audio/webm';const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
VIEWS.backup=()=>`${topbar('Daten sichern')}
  <p class="muted">${sv('Alles, was du in Anker eingetragen hast, liegt nur auf diesem Handy. Mit einer Sicherung kannst du es auf ein neues Handy mitnehmen.','Alle Daten liegen nur auf diesem Gerät. Mit einer Sicherung können Sie sie auf ein neues Gerät mitnehmen.')}</p>
  <div class="card"><h3>Sicherung erstellen</h3>
    <label class="toggle"><input type="checkbox" id="b-voice" checked> Sprachaufnahmen mitsichern</label>
    <button data-a="backup-make">Sicherungsdatei speichern</button>
    <p class="small muted">Die Datei enthält Kontakte, Notfallplan und Tagebuch. Bewahre sie sicher auf und schick sie niemandem. PINs werden nicht mitgespeichert.</p></div>
  <div class="card"><h3>Sicherung wiederherstellen</h3>
    <p class="small">Ersetzt alle Daten auf diesem Handy durch die aus der Datei.</p>
    <input type="file" id="b-file" accept=".json,application/json,text/plain" style="display:none">
    <button class="soft" data-a="backup-pick">Sicherungsdatei auswählen</button></div>
  <p id="b-msg" class="status" hidden></p>`;
function bMsg(tx,ok){const m=$('#b-msg');if(!m)return;m.className='status '+(ok?'ok':'wait');m.textContent=tx;m.hidden=false}
window.ankerSaved=ok=>bMsg(ok?'Sicherung gespeichert.':'Sicherung wurde nicht gespeichert.',ok);
async function backupMake(){
  const withVoice=$('#b-voice')&&$('#b-voice').checked;const data=clone(S);delete data.pin;delete data.diaryPin;
  const out={app:'anker',version:APP_VERSION,date:new Date().toISOString(),data,voice:[]};
  if(withVoice){for(const r of await IDB.all())out.voice.push({id:r.id,t:r.t,by:r.by,sec:r.sec,data:await blobToData(r.blob)})}
  const json=JSON.stringify(out),name=`anker-sicherung-${dayKey()}.json`;
  if(NATIVE&&typeof AnkerNative.saveFile==='function'){nat('saveFile',name,json);return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  bMsg('Die Sicherung wurde heruntergeladen.',true)}
function backupPick(){const f=$('#b-file');if(!f)return;f.onchange=()=>{const file=f.files&&f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>backupAsk(String(r.result));r.readAsText(file)};f.click()}
let BPEND=null;
function backupAsk(txt){let o;try{o=JSON.parse(txt)}catch(e){o=null}
  if(!o||o.app!=='anker'||!o.data){bMsg('Das ist keine Anker-Sicherung.',false);return}
  BPEND=o;const m=$('#b-msg');m.className='status wait';m.hidden=false;
  m.innerHTML=`<b>Sicherung vom ${fmtDate(o.date)}</b> gefunden (${(o.data.contacts||[]).length} Kontakte, ${(o.data.diary||[]).length} Tagebuch-Einträge${o.voice&&o.voice.length?', '+o.voice.length+' Aufnahmen':''}).<br>Alle aktuellen Daten werden ersetzt.<div class="row" style="margin-top:8px"><button class="danger" style="flex:1" data-a="backup-restore">Wiederherstellen</button><button class="ghost" data-a="go" data-v="backup">Abbrechen</button></div>`}
async function backupRestore(){const o=BPEND;if(!o)return;const pin=S.pin,dpin=S.diaryPin;
  S=Object.assign(clone(DEF),o.data);S.pin=pin;S.diaryPin=dpin;S.timer=null;S.setup=true;save();
  if(o.voice&&o.voice.length){await IDB.clear();for(const r of o.voice){try{await IDB.put({id:r.id,t:r.t,by:r.by,sec:r.sec,blob:dataToBlob(r.data)})}catch(e){}}}
  await syncVoiceCount();nat('cancelTimer');nat('setReminder',!!S.remind,S.remindHour);nat('setDiscreet',!!S.discreet);BPEND=null;
  go('home');}

/* ---- Feedback ---- */
const REPO='https://github.com/anker-hilfe/anker-app';
VIEWS.feedback=()=>`${topbar('Feedback geben')}
  <p class="muted">Hast du eine Idee oder einen Fehler gefunden? Das hilft, Anker besser zu machen.</p>
  <div class="card"><div class="field"><label for="fb-type">Worum geht es?</label><select id="fb-type"><option>Idee</option><option>Fehler</option><option>Frage</option><option>Sonstiges</option></select></div>
  <div class="field"><label for="fb-text">Deine Nachricht</label><textarea id="fb-text" rows="5" placeholder="z. B. Bei der Traumreise wäre Musik schön …"></textarea></div>
  <p id="fb-err" class="small" style="color:var(--alarm)" hidden>Bitte schreib kurz etwas.</p>
  <button data-a="fb-send">Auf GitHub senden</button><button class="ghost" data-a="fb-copy">Nur Text kopieren</button>
  <p id="fb-msg" class="small muted" hidden></p></div>
  <div class="note">Der Eintrag auf GitHub ist <b>öffentlich</b>. Schreib bitte keine Namen, Telefonnummern oder persönlichen Erlebnisse hinein. Zum Senden brauchst du ein kostenloses GitHub-Konto.</div>`;
function fbData(){const ty=$('#fb-type').value,tx=$('#fb-text').value.trim();if(!tx){$('#fb-err').hidden=false;return null}
  return {title:`[${ty}] ${tx.split('\n')[0].slice(0,60)}`,body:`${tx}\n\n---\nAnker ${APP_VERSION} · ${NATIVE?'Android-App':'Browser'} · ${S.age==='kind'?'Kind':S.age==='jugend'?'Jugendlich':'Erwachsen'} · ${S.tone==='kumpel'?'Kumpel':'Professionell'}`,ty}}

/* ---- Darstellung ---- */
function applyLook(){const r=document.documentElement;if(S.theme==='light'||S.theme==='dark')r.dataset.theme=S.theme;else delete r.dataset.theme;
  const z={1:'',2:'1.12',3:'1.25'}[S.fontSize||1]||'';r.style.zoom=z;}

/* ============ Start ============ */
(function boot(){
  const launch=(location.hash||'').slice(1)||nat('getLaunch')||'';
  if(launch==='helfer'){V={name:'helfer'};render();return}
  if(!S.setup){V={name:'setup',step:0};render();return}
  if(launch==='hilfe'){V={name:'help'};render();return}
  if(launch==='zeigen'){V={name:'card'};render();return}
  if(S.timer&&!NATIVE&&Date.now()>=S.timer.until){checkTimer();return}
  if(S.pin){V={name:'lock',next:needNews()?'news':'home'};render();return}
  V={name:needNews()?'news':'home'};render();
})();
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['hilfe','helfer','zeigen'].includes(h))ankerLaunch(h)});
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
