name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Web-Oberfläche in die App übernehmen
        run: cp index.html app/src/main/assets/index.html
      - name: APK bauen
        run: gradle assembleDebug --no-daemon
      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Anker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Anker-APK
          path: Anker.apk
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Anker (aktuelle Version)
          make_latest: true
          files: Anker.apk
          body: |
            Anker – Hilfe für schwere Momente.
            Anker.apk herunterladen, antippen und installieren (Installation aus unbekannten Quellen einmal erlauben).
            Beim ersten Start SMS, Telefon und Standort erlauben, damit der Notfall-Alarm automatisch senden kann.
            Die App ersetzt keine Therapie. Bei Lebensgefahr: 112.
